<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540">
  <title>6-5. ábra: Szinkron interfészkompatibilitás és a modell natív aszinkron működése</title>
  <desc>Az előző kompatibilitási megoldásban a futtatókörnyezet rendezi az események belépési sorrendjét, hogy a szinkron interfészű modell aszinkron feladatokban vehessen részt. A másik út az, hogy a modell eleve értse ezt a ritmust: dolgozhasson máson az eszköz futása alatt, és módosíthassa a későbbi munkát új felhasználói követelmények alapján. A GPT-6 Astra már támogatja az aszinkron eszközhívást (Async tool calling) és a kör közbeni iránymódosítást (Mid-turn steering), ami ezt a változást példázza (6-5. ábra).</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#555" /></marker>
    <style>
      text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#333}
      .title{font-size:20px;font-weight:700}
      .label{font-size:17px;font-weight:600}
      .small{font-size:15px}
      .box{fill:#f4f4f4;stroke:#555;stroke-width:1.5}
      .arrow{fill:none;stroke:#555;stroke-width:1.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="880" height="540" fill="#fff" />
  <rect x="20" y="20" width="840" height="145" rx="8" fill="#fff" stroke="#777" stroke-dasharray="7 4" />
  <text x="40" y="53" class="title">Kompatibilitás: a futtatókörnyezet ütemezi az aszinkron munkát</text>
  <rect x="40" y="75" width="230" height="60" rx="5" class="box" />
  <text x="155" y="100" text-anchor="middle" class="label">A feladat a háttérben fut</text>
  <text x="155" y="122" text-anchor="middle" class="small" style="font-size:13.94px">Egyértelműen befejezetlen állapot</text>
  <path d="M270 105 H313" class="arrow" />
  <rect x="320" y="75" width="240" height="60" rx="5" class="box" />
  <text x="440" y="100" text-anchor="middle" class="label">Új események fogadása</text>
  <text x="440" y="122" text-anchor="middle" class="small" style="font-size:14.20px">Sor, megszakítás vagy párhuzam</text>
  <path d="M560 105 H603" class="arrow" />
  <rect x="610" y="75" width="230" height="60" rx="5" class="box" />
  <text x="725" y="100" text-anchor="middle" class="label" style="font-size:15.47px">A modell folytatja a feladatot</text>
  <text x="725" y="122" text-anchor="middle" class="small">Bemenetek szinkron körökben</text>

  <rect x="20" y="185" width="840" height="250" rx="8" fill="#fff" stroke="#444" stroke-width="2" />
  <text x="40" y="218" class="title">Natív aszinkron működés: várakozás és menet közbeni változások megértése</text>
  <rect x="40" y="240" width="230" height="65" rx="5" class="box" />
  <text x="155" y="267" text-anchor="middle" class="label" style="font-size:16.15px">Hosszú lekérdezés indítása</text>
  <text x="155" y="290" text-anchor="middle" class="small">Találkozóhelyszínek keresése</text>
  <path d="M270 272 H313" class="arrow" />
  <rect x="320" y="240" width="240" height="65" rx="5" class="box" />
  <text x="440" y="267" text-anchor="middle" class="label">Munka várakozás közben</text>
  <text x="440" y="290" text-anchor="middle" class="small">Napirend és előkészületi lista</text>
  <path d="M560 272 H603" class="arrow" />
  <rect x="610" y="240" width="230" height="65" rx="5" class="box" />
  <text x="725" y="267" text-anchor="middle" class="label">Döntés az eredmény után</text>
  <text x="725" y="290" text-anchor="middle" class="small">Helyszínek és valós adatok</text>

  <rect x="40" y="340" width="230" height="65" rx="5" class="box" />
  <text x="155" y="367" text-anchor="middle" class="label" style="font-size:14.53px">Új felhasználói követelmények</text>
  <text x="155" y="390" text-anchor="middle" class="small">Keret vagy létszám változik</text>
  <path d="M270 372 H313" class="arrow" />
  <rect x="320" y="340" width="240" height="65" rx="5" class="box" />
  <text x="440" y="367" text-anchor="middle" class="label">Kész munka megőrzése</text>
  <text x="440" y="390" text-anchor="middle" class="small" style="font-size:14.53px">Új feltételek felvétele a feladatba</text>
  <path d="M560 372 H603" class="arrow" />
  <rect x="610" y="340" width="230" height="65" rx="5" class="box" />
  <text x="725" y="367" text-anchor="middle" class="label" style="font-size:14.20px">Következő lépések módosítása</text>
  <text x="725" y="390" text-anchor="middle" class="small" style="font-size:14.64px">Adatok és frissítések egyesítése</text>

  <rect x="20" y="455" width="840" height="65" rx="6" fill="#e9e9e9" />
  <text x="440" y="482" text-anchor="middle" class="label" style="font-size:16.41px">A modell megérti a változást és tervez; a futtatókörnyezet kezeli az eszközöket, állapotot és forrásokat.</text>
  <text x="440" y="506" text-anchor="middle" class="small">Az üzenetfogadáshoz helyes feladatfolytatás és műveletvezérlés is kell.</text>
</svg>
