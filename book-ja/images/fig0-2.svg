<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" style="background:#ffffff">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#666666"/>
    </marker>
  </defs>
  <g font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#2f2f2f">
    <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold">本書の構成</text>

    <!-- Part I: Build an Agent -->
    <rect x="24" y="58" width="852" height="238" rx="12" fill="#fafafa" stroke="#777777" stroke-width="1.7"/>
    <rect x="54" y="46" width="224" height="27" rx="13.5" fill="#505050"/>
    <text x="166" y="65" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">第I部　Agent の構築</text>

    <rect x="48" y="92" width="242" height="72" rx="8" fill="#d9d9d9" stroke="#3f3f3f" stroke-width="1.7"/>
    <text x="169" y="118" text-anchor="middle" font-size="12.5" font-weight="bold">第1章　AI Agent 入門</text>
    <text x="169" y="143" text-anchor="middle" font-size="9.5" fill="#626262">概念枠組み・ReAct・Harness</text>

    <line x1="290" y1="128" x2="319" y2="128" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="323" y="92" width="242" height="72" rx="8" fill="#e7e7e7" stroke="#444444" stroke-width="1.6"/>
    <text x="444" y="118" text-anchor="middle" font-size="12.5" font-weight="bold">第2章　コンテキストエンジニアリング</text>
    <text x="444" y="143" text-anchor="middle" font-size="9.5" fill="#626262">タスク状態・Prompt・圧縮</text>

    <line x1="565" y1="128" x2="594" y2="128" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="598" y="92" width="254" height="72" rx="8" fill="#e7e7e7" stroke="#444444" stroke-width="1.6"/>
    <text x="725" y="118" text-anchor="middle" font-size="12.5" font-weight="bold">第3章　ユーザーメモリと知識</text>
    <text x="725" y="143" text-anchor="middle" font-size="9.5" fill="#626262">セッション間メモリ・RAG・知識構成</text>

    <rect x="48" y="194" width="242" height="72" rx="8" fill="#e7e7e7" stroke="#444444" stroke-width="1.6"/>
    <text x="169" y="220" text-anchor="middle" font-size="12.5" font-weight="bold">第4章　ツール</text>
    <text x="169" y="245" text-anchor="middle" font-size="9.5" fill="#626262">MCP・知覚と実行・安全性</text>

    <line x1="290" y1="230" x2="319" y2="230" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="323" y="194" width="242" height="72" rx="8" fill="#e7e7e7" stroke="#444444" stroke-width="1.6"/>
    <text x="444" y="220" text-anchor="middle" font-size="12.5" font-weight="bold">第5章　Coding Agent</text>
    <text x="444" y="245" text-anchor="middle" font-size="9.5" fill="#626262">コード生成・汎用能力・ブートストラップ</text>

    <line x1="565" y1="230" x2="594" y2="230" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="598" y="194" width="254" height="72" rx="8" fill="#d9d9d9" stroke="#3f3f3f" stroke-width="1.7"/>
    <text x="725" y="220" text-anchor="middle" font-size="12.5" font-weight="bold">第6章　交互作用</text>
    <text x="725" y="245" text-anchor="middle" font-size="9.5" fill="#626262">観察・行動空間の拡張</text>

    <line x1="450" y1="296" x2="450" y2="332" stroke="#555555" stroke-width="1.8" marker-end="url(#arrow)"/>

    <!-- Part II: Improve Agent capabilities -->
    <rect x="24" y="335" width="852" height="211" rx="12" fill="#fafafa" stroke="#666666" stroke-width="1.8"/>
    <rect x="54" y="323" width="245" height="27" rx="13.5" fill="#424242"/>
    <text x="176.5" y="342" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">第II部　Agent 能力の向上</text>

    <rect x="43" y="382" width="190" height="112" rx="8" fill="#e8e8e8" stroke="#444444" stroke-width="1.6"/>
    <text x="138" y="412" text-anchor="middle" font-size="9" font-weight="bold">第7章　Agent の評価</text>
    <text x="138" y="440" text-anchor="middle" font-size="8" fill="#626262">環境・指標・統計</text>
    <text x="138" y="466" text-anchor="middle" font-size="8" fill="#626262">測定可能なフィードバック</text>

    <line x1="233" y1="438" x2="246" y2="438" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="250" y="382" width="190" height="112" rx="8" fill="#e2e2e2" stroke="#444444" stroke-width="1.6"/>
    <text x="345" y="412" text-anchor="middle" font-size="9" font-weight="bold">第8章　モデルのポストトレーニング</text>
    <text x="345" y="440" text-anchor="middle" font-size="8" fill="#626262">SFT・RL・報酬設計</text>
    <text x="345" y="466" text-anchor="middle" font-size="8" fill="#626262">モデルパラメータを強化</text>

    <line x1="440" y1="438" x2="453" y2="438" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="457" y="382" width="190" height="112" rx="8" fill="#d9d9d9" stroke="#3f3f3f" stroke-width="1.7"/>
    <text x="552" y="412" text-anchor="middle" font-size="9" font-weight="bold">第9章　継続的進化</text>
    <text x="552" y="440" text-anchor="middle" font-size="8" fill="#626262">経験・更新・リリースとロールバック</text>
    <text x="552" y="466" text-anchor="middle" font-size="8" fill="#626262">単体システムを強化</text>

    <line x1="647" y1="438" x2="660" y2="438" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="664" y="382" width="193" height="112" rx="8" fill="#cecece" stroke="#333333" stroke-width="1.8"/>
    <text x="760.5" y="412" text-anchor="middle" font-size="9" font-weight="bold">第10章　マルチ Agent 協調</text>
    <text x="760.5" y="440" text-anchor="middle" font-size="8" fill="#5d5d5d">分業・通信・調整</text>
    <text x="760.5" y="466" text-anchor="middle" font-size="8" fill="#5d5d5d">集合システムを強化</text>

    <text x="450" y="527" text-anchor="middle" font-size="10.5" fill="#666666">評価をフィードバックとし、ポストトレーニング・継続進化・協調で能力を拡張</text>
  </g>
</svg>
