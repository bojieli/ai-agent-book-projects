<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" style="background:#ffffff">
  <defs>
    <style>
      .t{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#26343c}
      .h{font-size:20px;font-weight:700}
      .s{font-size:16px;fill:#52636d}
      .box{fill:#f5f7f8;stroke:#33434d;stroke-width:2}
      .accent{fill:#e8f1f5;stroke:#2f617a;stroke-width:2}
    </style>
  </defs>
  <text x="500" y="30" text-anchor="middle" class="t h">能力の表現形式が主な更新場所を決める</text>

  <rect x="35" y="72" width="220" height="126" rx="9" class="box"/>
  <text x="145" y="105" text-anchor="middle" class="t h">知識</text>
  <text x="145" y="135" text-anchor="middle" class="t s">事実・経験・例外</text>
  <text x="145" y="164" text-anchor="middle" class="t s">Markdown / 知識ベース</text>

  <rect x="275" y="72" width="220" height="126" rx="9" class="box"/>
  <text x="385" y="105" text-anchor="middle" class="t h">指示</text>
  <text x="385" y="135" text-anchor="middle" class="t s">言語化できる判断原則</text>
  <text x="385" y="164" text-anchor="middle" class="t s">Prompt / Skill</text>

  <rect x="515" y="72" width="220" height="126" rx="9" class="box"/>
  <text x="625" y="105" text-anchor="middle" class="t h">プログラム</text>
  <text x="625" y="135" text-anchor="middle" class="t s">決定的な手順と強い制約</text>
  <text x="625" y="164" text-anchor="middle" class="t s" style="font-size:14px">ツール / ワークフロー / Harness</text>

  <rect x="755" y="72" width="220" height="126" rx="9" class="accent"/>
  <text x="865" y="105" text-anchor="middle" class="t h">パラメータ</text>
  <text x="865" y="135" text-anchor="middle" class="t s">高次元の知覚と暗黙の方策</text>
  <text x="865" y="164" text-anchor="middle" class="t s">SFT / 蒸留 / RL</text>

  <line x1="145" y1="226" x2="865" y2="226" stroke="#33434d" stroke-width="2"/>
  <path d="M145 218 V234 M865 218 V234" stroke="#33434d" stroke-width="2"/>
  <text x="145" y="260" text-anchor="middle" class="t s">更新しやすく追跡できる</text>
  <text x="865" y="260" text-anchor="middle" class="t s">内在化され推論コストが低い</text>
  <text x="500" y="289" text-anchor="middle" class="t h">一方向の階段ではなく四つの補完的な担い手</text>

  <rect x="145" y="320" width="710" height="58" rx="8" class="accent"/>
  <text x="500" y="344" text-anchor="middle" class="t h">最初の判断：その能力は事実・言語規則・プログラムで完全に表せるか？</text>
  <text x="500" y="367" text-anchor="middle" class="t s">安定性・コスト・更新頻度が配置を決める。パラメータ化の可否ではない</text>
</svg>
