<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 880 580" width="880" height="580">
<defs>
  <marker id="ah" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto">
    <polygon points="0 0, 12 4, 0 8" fill="#333333"/>
  </marker>
</defs>
<rect x="0" y="40" width="880" height="580" fill="#ffffff"/>

<rect x="95" y="50" width="210" height="44" rx="6" fill="#d0d0d0" stroke="#333333" stroke-width="2"/>
<text x="200" y="72" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="20" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold">MCP クライアント</text>
<rect x="575" y="50" width="210" height="44" rx="6" fill="#d0d0d0" stroke="#333333" stroke-width="2"/>
<text x="680" y="72" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="20" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold">MCP サーバー</text>
<line x1="200" y1="94" x2="200" y2="600" stroke="#999999" stroke-width="2" stroke-dasharray="8,4"/>
<line x1="680" y1="94" x2="680" y2="600" stroke="#999999" stroke-width="2" stroke-dasharray="8,4"/>

<line x1="204" y1="140" x2="676" y2="140" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
<text x="440" y="120" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="20" fill="#333333" text-anchor="middle" font-weight="bold">サーバー能力を発見（任意）</text>
<text x="440" y="162" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="14" fill="#777777" text-anchor="middle">server/discover</text>
<line x1="676" y1="205" x2="204" y2="205" stroke="#333333" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#ah)"/>
<text x="440" y="191" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="18" fill="#333333" text-anchor="middle" font-weight="bold">能力の説明を返す</text>
<rect x="230" y="218" width="420" height="42" rx="5" fill="#f5f5f5" stroke="#999999" stroke-width="2"/>
<text x="440" y="244" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="16" fill="#555555" text-anchor="middle">対応する能力と対話方法</text>

<line x1="204" y1="305" x2="676" y2="305" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
<text x="440" y="285" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="20" fill="#333333" text-anchor="middle" font-weight="bold">ツール一覧を取得</text>
<text x="440" y="327" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="14" fill="#777777" text-anchor="middle">tools/list</text>
<line x1="676" y1="370" x2="204" y2="370" stroke="#333333" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#ah)"/>
<text x="440" y="356" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="18" fill="#333333" text-anchor="middle" font-weight="bold">標準化されたツール定義を返す</text>
<rect x="230" y="383" width="420" height="58" rx="5" fill="#f5f5f5" stroke="#999999" stroke-width="2"/>
<text x="440" y="406" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="16" fill="#444444" text-anchor="middle" font-weight="bold">get_weather — 指定都市の天気を調べる</text>
<text x="440" y="428" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="15" fill="#666666" text-anchor="middle">入力：都市　　出力：天気情報</text>

<line x1="204" y1="485" x2="676" y2="485" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
<text x="440" y="465" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="20" fill="#333333" text-anchor="middle" font-weight="bold">選択したツールを呼び出す</text>
<text x="440" y="507" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="14" fill="#777777" text-anchor="middle">tools/call: get_weather (Beijing)</text>
<line x1="676" y1="550" x2="204" y2="550" stroke="#333333" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#ah)"/>
<text x="440" y="536" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="18" fill="#333333" text-anchor="middle" font-weight="bold">ツールの結果を返す</text>
<rect x="300" y="563" width="280" height="38" rx="5" fill="#f5f5f5" stroke="#999999" stroke-width="2"/>
<text x="440" y="587" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="16" fill="#555555" text-anchor="middle">北京：22°C、晴れ</text>

<text x="90" y="205" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="16" fill="#666666" text-anchor="middle" font-weight="bold"><tspan x="90" dy="-8">① 能力の</tspan><tspan x="90" dy="20">発見</tspan></text>
<text x="90" y="370" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="16" fill="#666666" text-anchor="middle" font-weight="bold"><tspan x="90" dy="-8">② ツールの</tspan><tspan x="90" dy="20">発見</tspan></text>
<text x="90" y="550" font-family="'Noto Sans CJK JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="16" fill="#666666" text-anchor="middle" font-weight="bold"><tspan x="90" dy="-8">③ ツールの</tspan><tspan x="90" dy="20">呼び出し</tspan></text>
</svg>
