<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540">
  <title>図6-5 同期インターフェースとの互換方式とモデルのネイティブな非同期能力</title>
  <desc>前述の互換方式では、ランタイムがイベントを受け入れる順序を整え、同期インターフェースのモデルを非同期タスクに参加させます。もう一つの経路は、モデル自身がこの対話のリズムを理解することです。ツールの実行中に別の作業を続け、ユーザーが途中で要求を追加したら、その後の作業を調整できます。GPT-6 Astra は非同期ツール呼び出し（Async tool calling）とターン途中の指示変更（Mid-turn steering）に対応しており、この変化を示しています（図6-5）。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#555" /></marker>
    <style>
      text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#333}
      .title{font-size:20px;font-weight:700}
      .label{font-size:17px;font-weight:600}
      .small{font-size:15px}
      .box{fill:#f4f4f4;stroke:#555;stroke-width:1.5}
      .arrow{fill:none;stroke:#555;stroke-width:1.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="880" height="540" fill="#fff" />
  <rect x="20" y="20" width="840" height="145" rx="8" fill="#fff" stroke="#777" stroke-dasharray="7 4" />
  <text x="40" y="53" class="title">互換方式：ランタイムが非同期の進行を調整</text>
  <rect x="40" y="75" width="230" height="60" rx="5" class="box" />
  <text x="155" y="100" text-anchor="middle" class="label" style="font-size:14.00px">タスクはバックグラウンドで実行</text>
  <text x="155" y="122" text-anchor="middle" class="small">「未完了」を明示して記録</text>
  <path d="M270 105 H313" class="arrow" />
  <rect x="320" y="75" width="240" height="60" rx="5" class="box" />
  <text x="440" y="100" text-anchor="middle" class="label" style="font-size:13.12px">ランタイムが新しいイベントを受信</text>
  <text x="440" y="122" text-anchor="middle" class="small">キュー・割り込み・並列を選択</text>
  <path d="M560 105 H603" class="arrow" />
  <rect x="610" y="75" width="230" height="60" rx="5" class="box" />
  <text x="725" y="100" text-anchor="middle" class="label">モデルがタスクを続ける</text>
  <text x="725" y="122" text-anchor="middle" class="small">入力は同期的な対話形式</text>

  <rect x="20" y="185" width="840" height="250" rx="8" fill="#fff" stroke="#444" stroke-width="2" />
  <text x="40" y="218" class="title">ネイティブな非同期：待機と途中の変化をモデルが理解</text>
  <rect x="40" y="240" width="230" height="65" rx="5" class="box" />
  <text x="155" y="267" text-anchor="middle" class="label" style="font-size:15.00px">時間のかかる問い合わせを開始</text>
  <text x="155" y="290" text-anchor="middle" class="small">例：会議会場を探す</text>
  <path d="M270 272 H313" class="arrow" />
  <rect x="320" y="240" width="240" height="65" rx="5" class="box" />
  <text x="440" y="267" text-anchor="middle" class="label">待機中も作業を続ける</text>
  <text x="440" y="290" text-anchor="middle" class="small">例：議題と準備リストを作る</text>
  <path d="M560 272 H603" class="arrow" />
  <rect x="610" y="240" width="230" height="65" rx="5" class="box" />
  <text x="725" y="267" text-anchor="middle" class="label">結果が届いてから判断</text>
  <text x="725" y="290" text-anchor="middle" class="small">実際の情報で会場を比較</text>

  <rect x="40" y="340" width="230" height="65" rx="5" class="box" />
  <text x="155" y="367" text-anchor="middle" class="label" style="font-size:16.15px">ユーザーが途中で要求を追加</text>
  <text x="155" y="390" text-anchor="middle" class="small">例：予算や人数の変更</text>
  <path d="M270 372 H313" class="arrow" />
  <rect x="320" y="340" width="240" height="65" rx="5" class="box" />
  <text x="440" y="367" text-anchor="middle" class="label">完了済みの作業を保持</text>
  <text x="440" y="390" text-anchor="middle" class="small">新しい要求をタスクに反映</text>
  <path d="M560 372 H603" class="arrow" />
  <rect x="610" y="340" width="230" height="65" rx="5" class="box" />
  <text x="725" y="367" text-anchor="middle" class="label">その後の行動を調整</text>
  <text x="725" y="390" text-anchor="middle" class="small">既存情報とすべての更新を統合</text>

  <rect x="20" y="455" width="840" height="65" rx="6" fill="#e9e9e9" />
  <text x="440" y="482" text-anchor="middle" class="label">モデルは変化を理解して計画を調整。ランタイムは実行・状態・イベントの出所を管理。</text>
  <text x="440" y="506" text-anchor="middle" class="small">メッセージの受信に加え、正しいタスク再開と実際の動作の制御が必要。</text>
</svg>
