<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" style="background:#ffffff">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#33434d"/></marker>
    <style>
      .t{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#26343c}
      .h{font-size:19px;font-weight:700}
      .s{font-size:15px;fill:#52636d}
      .box{fill:#f5f7f8;stroke:#33434d;stroke-width:2}
      .accent{fill:#e8f1f5;stroke:#2f617a;stroke-width:2}
      .line{fill:none;stroke:#33434d;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="500" y="30" text-anchor="middle" class="t h">経験の知識化：生の軌跡は証拠、知識文書こそ再利用の単位</text>

  <rect x="22" y="78" width="168" height="96" rx="8" class="box"/>
  <text x="106" y="111" text-anchor="middle" class="t h">生の軌跡</text>
  <text x="106" y="139" text-anchor="middle" class="t s">行動・結果・環境</text>
  <text x="106" y="160" text-anchor="middle" class="t s">不変の証拠</text>

  <rect x="215" y="78" width="168" height="96" rx="8" class="box"/>
  <text x="299" y="111" text-anchor="middle" class="t h">単発の評価</text>
  <text x="299" y="139" text-anchor="middle" class="t s">成功・失敗・ラベル</text>
  <text x="299" y="160" text-anchor="middle" class="t s">証拠の位置を保持</text>

  <rect x="408" y="63" width="184" height="126" rx="8" class="accent"/>
  <text x="500" y="97" text-anchor="middle" class="t h" style="font-size:18px">軌跡をまたいだ比較</text>
  <text x="500" y="128" text-anchor="middle" class="t s">同種のタスクを集約</text>
  <text x="500" y="151" text-anchor="middle" class="t s">成功と失敗を対照</text>
  <text x="500" y="174" text-anchor="middle" class="t s">共通点と境界を抽出</text>

  <rect x="617" y="63" width="184" height="126" rx="8" class="accent"/>
  <text x="709" y="97" text-anchor="middle" class="t h">Markdown 文書</text>
  <text x="709" y="128" text-anchor="middle" class="t s">適用場面と方針</text>
  <text x="709" y="151" text-anchor="middle" class="t s">例外・禁止領域・出典</text>
  <text x="709" y="174" text-anchor="middle" class="t s">バージョンと検証日時</text>

  <rect x="826" y="78" width="152" height="96" rx="8" class="box"/>
  <text x="902" y="111" text-anchor="middle" class="t h">検索して活用</text>
  <text x="902" y="139" text-anchor="middle" class="t s" style="font-size:9px">新しいタスクで必要に応じ読み込む</text>
  <text x="902" y="160" text-anchor="middle" class="t s" style="font-size:10.5px">フィードバックを生み続ける</text>

  <path d="M190 126 H213" class="line"/>
  <path d="M383 126 H406" class="line"/>
  <path d="M592 126 H615" class="line"/>
  <path d="M801 126 H824" class="line"/>

  <path d="M902 174 V244 H500 V191" class="line" stroke-dasharray="7 5"/>
  <text x="700" y="270" text-anchor="middle" class="t s">新しい証拠は旧知識を改訂・限定・淘汰する</text>

  <rect x="215" y="302" width="586" height="48" rx="8" fill="#fafbfb" stroke="#9aa8af"/>
  <text x="508" y="332" text-anchor="middle" class="t s" style="font-size:14.5px">第3章の抽出・検索基盤を共用し、本章では軌跡評価と行動改善の閉ループを追加する</text>
</svg>
