<rect x="540" y="65" width="200" height="120" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<text x="640" y="85" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold" direction="rtl" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">إحداثيات إخراج النموذج</text>
<text x="640" y="108" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal" direction="rtl" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">بناءً على الصورة التي تم تصغير حجمها</text>
<text x="640" y="128" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" direction="rtl" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">التنبؤ: (683، 384)</text>
<circle cx="650" cy="145" r="4" fill="#333333" stroke="#333333" stroke-width="2"/>
<text x="640" y="168" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal" direction="rtl" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">→ الرجوع إلى الدقة الفعلية</text>
<line x1="242" y1="110" x2="288" y2="110" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
<text x="265.0" y="100.0" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#666666" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">تصغير الحجم</text>
<line x1="492" y1="140" x2="538" y2="140" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
<line x1="538" y1="110" x2="492" y2="110" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
<text x="515.0" y="100.0" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#666666" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">الإحداثيات</text>
<rect x="40" y="200" width="700" height="60" rx="4" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
<text x="390" y="218" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold" direction="rtl" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">سير العمل الكامل</text>
<text x="390" y="242" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal" direction="rtl" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">① حدد دقة الهدف حسب نسبة العرض إلى الارتفاع → ② لقطة شاشة ذات نطاق منخفض باستخدام ImageMagick → ③ ينشئ استنتاج النموذج إحداثيات → ④ زيادة الحجم بشكل متناسب → ⑤ نفذ باستخدام xdotool</text>
<rect x="40" y="275" width="700" height="55" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<text x="390" y="293" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold" direction="rtl" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">مثال على القياس (شاشة 16:9 ← FWXGA)</text>
<text x="390" y="315" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal" direction="rtl" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">لقطة الشاشة: 2560×1440 → 1366×768 (×0.53) |  الإحداثيات: نموذج (683، 384) → فعلي (1280، 720) (×1.87)</text>
