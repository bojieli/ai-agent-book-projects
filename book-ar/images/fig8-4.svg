<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" style="background:#ffffff">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#33434d"/></marker>
    <style>
      .t{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#26343c}
      .h{font-size:19px;font-weight:700}
      .s{font-size:15px;fill:#52636d}
      .box{fill:#f5f7f8;stroke:#33434d;stroke-width:2}
      .accent{fill:#e8f1f5;stroke:#2f617a;stroke-width:2}
      .line{fill:none;stroke:#33434d;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="500" y="30" text-anchor="middle" class="t h">تحويل الخبرة إلى معرفة: المسارات دليل، والوثيقة هي وحدة إعادة الاستخدام</text>

  <rect x="22" y="78" width="168" height="96" rx="8" class="box"/>
  <text x="106" y="111" text-anchor="middle" class="t h">المسار الخام</text>
  <text x="106" y="139" text-anchor="middle" class="t s" style="font-size:10px">الإجراءات والنتائج والبيئة</text>
  <text x="106" y="160" text-anchor="middle" class="t s" style="font-size:13px">دليل غير قابل للتغيير</text>

  <rect x="215" y="78" width="168" height="96" rx="8" class="box"/>
  <text x="299" y="111" text-anchor="middle" class="t h">تقييم مفرد</text>
  <text x="299" y="139" text-anchor="middle" class="t s">نجاح، فشل، وسوم</text>
  <text x="299" y="160" text-anchor="middle" class="t s">يحفظ موضع الدليل</text>

  <rect x="408" y="63" width="184" height="126" rx="8" class="accent"/>
  <text x="500" y="97" text-anchor="middle" class="t h" style="font-size:15px">مقارنة عبر المسارات</text>
  <text x="500" y="128" text-anchor="middle" class="t s" style="font-size:13.5px">تجميع المهام المتشابهة</text>
  <text x="500" y="151" text-anchor="middle" class="t s" style="font-size:14.5px">مقابلة النجاح بالفشل</text>
  <text x="500" y="174" text-anchor="middle" class="t s" style="font-size:9px">استخراج القواسم المشتركة والحدود</text>

  <rect x="617" y="63" width="184" height="126" rx="8" class="accent"/>
  <text x="709" y="97" text-anchor="middle" class="t h">وثيقة Markdown</text>
  <text x="709" y="128" text-anchor="middle" class="t s" style="font-size:9px">سيناريوهات التطبيق والاستراتيجية</text>
  <text x="709" text-anchor="middle" class="t s" y="142.59" style="font-size:14.5px">الاستثناءات والمناطق</text><text x="709" text-anchor="middle" class="t s" y="159.41" style="font-size:14.5px">المحظورة والمصادر</text>
  <text x="709" y="174" text-anchor="middle" class="t s">الإصدار ووقت التحقق</text>

  <rect x="826" y="78" width="152" height="96" rx="8" class="box"/>
  <text x="902" y="111" text-anchor="middle" class="t h" style="font-size:12.5px">الاسترجاع والتطبيق</text>
  <text x="902" text-anchor="middle" class="t s" y="131.17" style="font-size:13.5px">التحميل عند الحاجة</text><text x="902" text-anchor="middle" class="t s" y="146.83" style="font-size:13.5px">للمهام الجديدة</text>
  <text x="902" y="160" text-anchor="middle" class="t s" style="font-size:9px">يواصل توليد التغذية الراجعة</text>

  <path d="M190 126 H213" class="line"/>
  <path d="M383 126 H406" class="line"/>
  <path d="M592 126 H615" class="line"/>
  <path d="M801 126 H824" class="line"/>

  <path d="M902 174 V244 H500 V191" class="line" stroke-dasharray="7 5"/>
  <text x="700" y="270" text-anchor="middle" class="t s">الأدلة الجديدة تنقّح المعرفة القديمة أو تقيّدها أو تلغيها</text>

  <rect x="215" y="302" width="586" height="48" rx="8" fill="#fafbfb" stroke="#9aa8af"/>
  <text x="508" y="332" text-anchor="middle" class="t s" style="font-size:10.5px">يشارك بنية الاستخراج والاسترجاع مع الفصل الثالث؛ ويضيف هذا الفصل تقييم المسارات وحلقة تحسين السلوك</text>
</svg>
