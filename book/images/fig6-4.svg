<svg xmlns="http://www.w3.org/2000/svg" width="880" height="620" viewBox="0 0 880 620" style="background:#ffffff">
  <title>同步接口兼容与 Astra 原生异步</title>
  <desc>同步接口通过任务句柄或占位符接入新事件；Astra 的异步工具与 steering 由原生协议支持，应用仍管理执行与结果归属。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#444"/></marker>
    <style>
      text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#333}
      .title{font-size:20px;font-weight:700}
      .label{font-size:16px;font-weight:600}
      .small{font-size:14px}
      .code{font-family:Menlo,Consolas,monospace;font-size:13px}
      .box{fill:#f4f4f4;stroke:#555;stroke-width:1.5}
      .line{fill:none;stroke:#555;stroke-width:1.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="880" height="620" fill="#fff"/>
  <rect x="20" y="20" width="840" height="162" rx="8" fill="#fff" stroke="#777" stroke-dasharray="7 4"/>
  <text x="40" y="51" class="title">兼容路径：模型或接口要求同步工具配对</text>
  <rect x="40" y="72" width="176" height="62" rx="5" class="box"/>
  <text x="128" y="97" class="label" text-anchor="middle">发起后台任务</text>
  <text x="128" y="120" class="small" text-anchor="middle">返回句柄或未完成状态</text>
  <path d="M216 103 H243" class="line"/>
  <rect x="249" y="72" width="176" height="62" rx="5" class="box"/>
  <text x="337" y="97" class="label" text-anchor="middle">应用接入新事件</text>
  <text x="337" y="120" class="small" text-anchor="middle">排队 / 取消后重新请求</text>
  <path d="M425 103 H452" class="line"/>
  <rect x="458" y="72" width="176" height="62" rx="5" class="box"/>
  <text x="546" y="97" class="label" text-anchor="middle">模型继续任务</text>
  <text x="546" y="120" class="small" text-anchor="middle">显式记录任务仍在运行</text>
  <path d="M634 103 H661" class="line"/>
  <rect x="667" y="72" width="173" height="62" rx="5" class="box"/>
  <text x="753" y="97" class="label" text-anchor="middle">真实结果到达</text>
  <text x="753" y="120" class="small" text-anchor="middle">按任务 ID 接入新事件</text>
  <text x="40" y="162" class="small">运行时实现异步；模型仍通过同步格式交互。适用于不支持原生能力的组合。</text>
  <rect x="20" y="202" width="840" height="320" rx="8" fill="#fff" stroke="#444" stroke-width="2"/>
  <text x="40" y="234" class="title">原生路径：GPT-6 Astra + Responses API</text>
  <text x="40" y="266" class="label">异步工具</text>
  <rect x="40" y="282" width="226" height="65" rx="5" class="box"/>
  <text x="153" y="307" class="code" text-anchor="middle">function / custom</text>
  <text x="153" y="331" class="code" text-anchor="middle">async: true · call_id</text>
  <path d="M266 315 H307" class="line"/>
  <rect x="313" y="282" width="244" height="65" rx="5" class="box"/>
  <text x="435" y="307" class="label" text-anchor="middle">应用执行工具 ∥ 模型继续工作</text>
  <text x="435" y="331" class="small" text-anchor="middle">推理、其他工具、独立回答</text>
  <path d="M557 315 H598" class="line"/>
  <rect x="604" y="282" width="236" height="65" rx="5" class="box"/>
  <text x="722" y="307" class="label" text-anchor="middle">随后归还真实结果</text>
  <text x="722" y="331" class="small" text-anchor="middle">原始 call_id + 最新 response</text>
  <text x="40" y="383" class="label">回合中途 steering（同一 WebSocket）</text>
  <rect x="40" y="400" width="226" height="67" rx="5" class="box"/>
  <text x="153" y="425" class="label" text-anchor="middle">response 仍在生成</text>
  <text x="153" y="449" class="code" text-anchor="middle">→ response.steer(user)</text>
  <path d="M266 433 H307" class="line"/>
  <rect x="313" y="400" width="244" height="67" rx="5" class="box"/>
  <text x="435" y="425" class="label" text-anchor="middle">accepted：更新已排队</text>
  <text x="435" y="449" class="small" text-anchor="middle">在安全输出边界完成接续</text>
  <path d="M557 433 H598" class="line"/>
  <rect x="604" y="400" width="236" height="67" rx="5" class="box"/>
  <text x="722" y="425" class="label" text-anchor="middle">新的 response ID</text>
  <text x="722" y="449" class="small" text-anchor="middle">保留已完成内容，应用更新</text>
  <text x="40" y="495" class="small">需要客户端工具结果时：pending → 补齐 required_input → 续接；不要重发已接收的 steering。</text>
  <rect x="20" y="542" width="840" height="57" rx="6" fill="#e9e9e9"/>
  <text x="440" y="566" class="label" text-anchor="middle">原生能力已经可用；任务状态、结果匹配与工具取消仍由运行时负责</text>
  <text x="440" y="588" class="small" text-anchor="middle">同一个用户任务可以跨多个 response；steering 不自动撤销已发生的动作。</text>
</svg>
