<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540">
  <title>同步接口兼容与模型原生异步</title>
  <desc>运行时通过状态和事件队列兼容同步模型；原生异步模型可以边等待工具边工作，并根据用户中途更新调整后续行动。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#555"/></marker>
    <style>
      text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#333}
      .title{font-size:20px;font-weight:700}
      .label{font-size:17px;font-weight:600}
      .small{font-size:15px}
      .box{fill:#f4f4f4;stroke:#555;stroke-width:1.5}
      .arrow{fill:none;stroke:#555;stroke-width:1.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="880" height="540" fill="#fff"/>
  <rect x="20" y="20" width="840" height="145" rx="8" fill="#fff" stroke="#777" stroke-dasharray="7 4"/>
  <text x="40" y="53" class="title">兼容方案：运行时安排异步节奏</text>
  <rect x="40" y="75" width="230" height="60" rx="5" class="box"/>
  <text x="155" y="100" text-anchor="middle" class="label">任务在后台运行</text>
  <text x="155" y="122" text-anchor="middle" class="small">明确记录“尚未完成”</text>
  <path d="M270 105 H313" class="arrow"/>
  <rect x="320" y="75" width="240" height="60" rx="5" class="box"/>
  <text x="440" y="100" text-anchor="middle" class="label">运行时接入新事件</text>
  <text x="440" y="122" text-anchor="middle" class="small">决定排队、打断或并行处理</text>
  <path d="M560 105 H603" class="arrow"/>
  <rect x="610" y="75" width="230" height="60" rx="5" class="box"/>
  <text x="725" y="100" text-anchor="middle" class="label">模型继续处理任务</text>
  <text x="725" y="122" text-anchor="middle" class="small">仍按同步交互方式接收信息</text>

  <rect x="20" y="185" width="840" height="250" rx="8" fill="#fff" stroke="#444" stroke-width="2"/>
  <text x="40" y="218" class="title">原生异步：模型理解等待与中途变化</text>
  <rect x="40" y="240" width="230" height="65" rx="5" class="box"/>
  <text x="155" y="267" text-anchor="middle" class="label">发起耗时查询</text>
  <text x="155" y="290" text-anchor="middle" class="small">例如：查询会议场地</text>
  <path d="M270 272 H313" class="arrow"/>
  <rect x="320" y="240" width="240" height="65" rx="5" class="box"/>
  <text x="440" y="267" text-anchor="middle" class="label">等待期间继续工作</text>
  <text x="440" y="290" text-anchor="middle" class="small">例如：整理议程与准备清单</text>
  <path d="M560 272 H603" class="arrow"/>
  <rect x="610" y="240" width="230" height="65" rx="5" class="box"/>
  <text x="725" y="267" text-anchor="middle" class="label">结果到达后作出决策</text>
  <text x="725" y="290" text-anchor="middle" class="small">依据真实信息比较场地</text>

  <rect x="40" y="340" width="230" height="65" rx="5" class="box"/>
  <text x="155" y="367" text-anchor="middle" class="label">用户中途补充要求</text>
  <text x="155" y="390" text-anchor="middle" class="small">例如：预算与人数变化</text>
  <path d="M270 372 H313" class="arrow"/>
  <rect x="320" y="340" width="240" height="65" rx="5" class="box"/>
  <text x="440" y="367" text-anchor="middle" class="label">保留已完成的工作</text>
  <text x="440" y="390" text-anchor="middle" class="small">将新要求纳入当前任务</text>
  <path d="M560 372 H603" class="arrow"/>
  <rect x="610" y="340" width="230" height="65" rx="5" class="box"/>
  <text x="725" y="367" text-anchor="middle" class="label">调整后续行动</text>
  <text x="725" y="390" text-anchor="middle" class="small">综合已有信息与全部更新</text>

  <rect x="20" y="455" width="840" height="65" rx="6" fill="#e9e9e9"/>
  <text x="440" y="482" text-anchor="middle" class="label">模型理解变化、调整计划；运行时管理工具执行、任务状态与事件来源</text>
  <text x="440" y="506" text-anchor="middle" class="small">能接收异步消息，还需要能正确恢复任务并控制实际动作。</text>
</svg>
