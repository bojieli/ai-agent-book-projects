<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" style="background:#ffffff">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#33434d"/></marker>
    <style>
      .t{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#26343c}
      .h{font-size:19px;font-weight:700}
      .s{font-size:15px;fill:#52636d}
      .box{fill:#f5f7f8;stroke:#33434d;stroke-width:2}
      .accent{fill:#e8f1f5;stroke:#2f617a;stroke-width:2}
      .line{fill:none;stroke:#33434d;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="500" y="30" text-anchor="middle" class="t h">Опыт в знание: траектории — доказательство, документ — единица переиспользования</text>

  <rect x="22" y="78" width="168" height="96" rx="8" class="box"/>
  <text x="106" y="111" text-anchor="middle" class="t h" style="font-size:13px">Исходная траектория</text>
  <text x="106" y="139" text-anchor="middle" class="t s" style="font-size:10px">Действия, результаты, среда</text>
  <text x="106" y="160" text-anchor="middle" class="t s" style="font-size:9.5px">Неизменяемое доказательство</text>

  <rect x="215" y="78" width="168" height="96" rx="8" class="box"/>
  <text x="299" y="111" text-anchor="middle" class="t h" style="font-size:18px">Разовая оценка</text>
  <text x="299" y="139" text-anchor="middle" class="t s" style="font-size:14px">Успех, провал, метки</text>
  <text x="299" text-anchor="middle" class="t s" y="151.3" style="font-size:15px">Сохраняет место</text><text x="299" text-anchor="middle" class="t s" y="168.7" style="font-size:15px">доказательства</text>

  <rect x="408" y="63" width="184" height="126" rx="8" class="accent"/>
  <text x="500" y="97" text-anchor="middle" class="t h" style="font-size:10px">Сравнение между траекториями</text>
  <text x="500" y="128" text-anchor="middle" class="t s" style="font-size:12px">Объединить схожие задачи</text>
  <text x="500" y="151" text-anchor="middle" class="t s" style="font-size:11.5px">Сопоставить успех и провал</text>
  <text x="500" y="174" text-anchor="middle" class="t s" style="font-size:12.5px">Выделить общее и границы</text>

  <rect x="617" y="63" width="184" height="126" rx="8" class="accent"/>
  <text x="709" y="97" text-anchor="middle" class="t h" style="font-size:16.5px">Документ Markdown</text>
  <text x="709" y="128" text-anchor="middle" class="t s" style="font-size:9.5px">Сценарии применения и стратегия</text>
  <text x="709" y="151" text-anchor="middle" class="t s" style="font-size:10px">Исключения, запреты, источники</text>
  <text x="709" y="174" text-anchor="middle" class="t s" style="font-size:13px">Версия и время проверки</text>

  <rect x="826" y="78" width="152" height="96" rx="8" class="box"/>
  <text x="902" y="111" text-anchor="middle" class="t h" style="font-size:13px">Поиск и применение</text>
  <text x="902" text-anchor="middle" class="t s" y="130.3" style="font-size:15px">Загружать по</text><text x="902" text-anchor="middle" class="t s" y="147.7" style="font-size:15px">мере надобности</text>
  <text x="902" text-anchor="middle" class="t s" y="152.17" style="font-size:13.5px">Продолжает давать</text><text x="902" text-anchor="middle" class="t s" y="167.83" style="font-size:13.5px">обратную связь</text>

  <path d="M190 126 H213" class="line"/>
  <path d="M383 126 H406" class="line"/>
  <path d="M592 126 H615" class="line"/>
  <path d="M801 126 H824" class="line"/>

  <path d="M902 174 V244 H500 V191" class="line" stroke-dasharray="7 5"/>
  <text x="700" y="270" text-anchor="middle" class="t s">Новые доказательства правят, сужают или отменяют старое знание</text>

  <rect x="215" y="302" width="586" height="48" rx="8" fill="#fafbfb" stroke="#9aa8af"/>
  <text x="508" text-anchor="middle" class="t s" y="323.3" style="font-size:15px">Использует инфраструктуру извлечения и поиска из главы 3;</text><text x="508" text-anchor="middle" class="t s" y="340.7" style="font-size:15px">здесь добавлены оценка траекторий и цикл улучшения поведения</text>
</svg>
