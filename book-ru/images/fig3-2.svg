<rect x="38" y="126" width="172" height="84" rx="4" fill="#f5f5f5" stroke="#999999" stroke-width="2"/>
<text x="48" y="150" font-family="'Courier New', Courier, monospace" fill="#333333" text-anchor="start" dominant-baseline="central" style="font-size:13.5px">«Почта пользователя:</text>
