<text x="720" y="172" font-family="'Courier New', Courier, monospace" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central">+ person</text>
<text x="720" y="194" font-family="'Courier New', Courier, monospace" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central">+ relationship</text>
<text x="796.0" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" y="229.04" style="font-size:12px">✓ Снятие неоднозначности</text><text x="796.0" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal" y="242.96" style="font-size:12px">· управление знаниями</text>
<text x="796.0" y="262" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal">✓ С источниками и связями</text>
<text x="796.0" y="292" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal" style="font-size:12px">✗ Дорого создавать и поддерживать</text>
<line x1="70" y1="400" x2="850" y2="400" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
