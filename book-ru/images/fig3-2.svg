<text x="850" y="383" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#666666" text-anchor="end" dominant-baseline="central" font-weight="normal" style="font-size:9px">Выразительность</text>
<text x="460" y="424" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">Простота падает, выразительность растёт</text>
