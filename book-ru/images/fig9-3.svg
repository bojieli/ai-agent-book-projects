<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" style="background:#ffffff">
  <defs>
    <style>
      .t{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#26343c}
      .h{font-size:20px;font-weight:700}
      .s{font-size:16px;fill:#52636d}
      .box{fill:#f5f7f8;stroke:#33434d;stroke-width:2}
      .accent{fill:#e8f1f5;stroke:#2f617a;stroke-width:2}
    </style>
  </defs>
  <text x="500" y="30" text-anchor="middle" class="t h">Форма представления способности определяет место обновления</text>

  <rect x="35" y="72" width="220" height="126" rx="9" class="box"/>
  <text x="145" y="105" text-anchor="middle" class="t h">Знания</text>
  <text x="145" y="135" text-anchor="middle" class="t s">Факты, опыт, исключения</text>
  <text x="145" y="164" text-anchor="middle" class="t s">Markdown / база знаний</text>

  <rect x="275" y="72" width="220" height="126" rx="9" class="box"/>
  <text x="385" y="105" text-anchor="middle" class="t h">Инструкции</text>
  <text x="385" y="135" text-anchor="middle" class="t s" style="font-size:10px">Принципы суждения, выразимые словами</text>
  <text x="385" y="164" text-anchor="middle" class="t s">Prompt / Skill</text>

  <rect x="515" y="72" width="220" height="126" rx="9" class="box"/>
  <text x="625" y="105" text-anchor="middle" class="t h">Программы</text>
  <text x="625" text-anchor="middle" class="t s" y="127.46" style="font-size:13px">Детерминированные процессы</text><text x="625" text-anchor="middle" class="t s" y="142.54" style="font-size:13px">и жёсткие ограничения</text>
  <text x="625" y="164" text-anchor="middle" class="t s" style="font-size:12.5px">Инструменты / Workflow / Harness</text>

  <rect x="755" y="72" width="220" height="126" rx="9" class="accent"/>
  <text x="865" y="105" text-anchor="middle" class="t h">Параметры</text>
  <text x="865" text-anchor="middle" class="t s" y="126.01" style="font-size:15.5px">Многомерное восприятие</text><text x="865" text-anchor="middle" class="t s" y="143.99" style="font-size:15.5px">и неявная политика</text>
  <text x="865" y="164" text-anchor="middle" class="t s">SFT / Дистилляция / RL</text>

  <line x1="145" y1="226" x2="865" y2="226" stroke="#33434d" stroke-width="2"/>
  <path d="M145 218 V234 M865 218 V234" stroke="#33434d" stroke-width="2"/>
  <text x="145" y="260" text-anchor="middle" class="t s">Легко обновлять, прослеживаемо</text>
  <text x="865" y="260" text-anchor="middle" class="t s" style="font-size:14px">Усвоено, низкая стоимость вывода</text>
  <text x="500" y="289" text-anchor="middle" class="t h">Не односторонняя лестница, а четыре взаимодополняющих носителя</text>

  <rect x="145" y="320" width="710" height="58" rx="8" class="accent"/>
  <text x="500" y="344" text-anchor="middle" class="t h" style="font-size:14.5px">Главный вопрос: выразима ли способность фактами, правилами языка или программой?</text>
  <text x="500" y="367" text-anchor="middle" class="t s" style="font-size:12.5px">Способ развёртывания задают стабильность, стоимость и частота обновлений, а не параметризуемость</text>
</svg>
