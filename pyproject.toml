[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbook"
version = "0.1.0"
description = "Shared packaging and plumbing for the ai-agent-book companion experiments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# The core that nearly every experiment needs.
# openai: 131 declarations across the repo; python-dotenv: 114; requests: 50.
dependencies = [
    "openai>=1.35",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

# ---------------------------------------------------------------------------
# Capability groups.
#
# Install only what an experiment actually needs:
#     pip install -e ".[ch1]"      # chapter 1, no GPU stack
#     pip install -e ".[ch7]"      # heavy fine-tuning deps, opt in explicitly
#
# Groups are derived from an audit of the repo's per-project requirements.txt
# files. Vendored third-party trees (chapter8/gaia-experience/AWorld,
# chapter8/browser-use-rpa/browser-use, chapter2/prompt-engineering/tau_bench)
# are deliberately excluded -- they carry their own requirements.
# ---------------------------------------------------------------------------
[project.optional-dependencies]

# Plotting, tables and dataframes used by most analysis/eval experiments.
viz = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "seaborn>=0.12",
    "tabulate>=0.9",
    "tqdm>=4.66",
]

# Document parsing and generation (PDF/Office).
docs = [
    "pypdf>=4.0",
    "pdfplumber>=0.10",
    "reportlab>=4.0",
    "python-docx>=1.1",
    "python-pptx>=0.6",
    "openpyxl>=3.1",
]

# HTML fetching/parsing and browser automation.
web = [
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "html2text>=2020.1.16",
    "playwright>=1.40",
]

# HTTP services used by the interactive/demo experiments.
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

# Token counting. Small and widely used, so it is its own group rather than
# forcing a chapter that only counts tokens to pull the whole `rag` stack.
tokens = [
    "tiktoken>=0.6",
]

# Statistics and interactive plots for the evaluation/benchmark experiments.
analysis = [
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "plotly>=5.18",
]

# Retrieval / vector stores / embeddings.
rag = [
    "agentbook[tokens]",
    "chromadb>=0.4",
    "faiss-cpu>=1.7",
    "sentence-transformers>=2.2",
    "rank-bm25>=0.2",
]

# Model Context Protocol servers and clients.
mcp = [
    "mcp[cli]>=1.0",
    "fastmcp>=0.2",
]

# Alternative model providers beyond the OpenAI-compatible core.
providers = [
    "anthropic>=0.25",
    "google-genai>=0.3",
    "mistralai>=1.0",
    "litellm>=1.40",
    "ollama>=0.2",
]

# Local fine-tuning / training stack. Large downloads, GPU-oriented.
# Intentionally NOT part of `all`.
train = [
    "torch>=2.2",
    "transformers>=4.40",
    "datasets>=2.19",
    "accelerate>=0.30",
    "peft>=0.10",
    "trl>=0.9",
    "bitsandbytes>=0.43",
    "sentencepiece>=0.2",
    "wandb>=0.17",
]

# Audio processing for the local speech/TTS training experiments (chapter 7).
# Note: chapter 9 uses hosted speech APIs and needs only the core.
audio = [
    "librosa>=0.10",
    "soundfile>=0.12",
    "torchaudio>=2.2",
]

# Test and lint tooling.
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

# ---------------------------------------------------------------------------
# Chapter aggregates -- what a reader installs to run one chapter.
# ---------------------------------------------------------------------------
ch1  = ["agentbook[viz,docs]"]
ch2  = ["agentbook[viz,web,serve,providers,tokens]"]
ch3  = ["agentbook[viz,docs,web,serve,rag,analysis]"]
ch4  = ["agentbook[viz,docs,web,serve,mcp,tokens,analysis]"]
ch5  = ["agentbook[viz,web,serve,mcp,providers,analysis]"]
ch6  = ["agentbook[viz,tokens,analysis]"]
ch7  = ["agentbook[train,audio,viz]"]
ch8  = ["agentbook[viz,docs,web,serve,rag,mcp,providers]"]
ch9  = []                                    # hosted speech APIs: core only
ch10 = ["agentbook[tokens]"]                 # tiktoken only

# Everything except the heavy local-training stack, so `all` stays CPU-friendly.
all = ["agentbook[viz,docs,web,serve,rag,mcp,providers,tokens,analysis,dev]"]

[project.urls]
Homepage = "https://github.com/bojieli/ai-agent-book"
Issues = "https://github.com/bojieli/ai-agent-book/issues"

[tool.setuptools.packages.find]
include = ["agentbook*"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "chapter8/gaia-experience/AWorld",
    "chapter8/browser-use-rpa/browser-use",
    "chapter2/prompt-engineering/tau_bench",
    "_web",
]
