  kind: doc
  org_domain: risk
  classification: confidential
  acl:
  - u_risk_pm
  title: 策略 pol_fraud_rule_88
  body: '策略 pol_fraud_rule_88 上线前必须 Shadow 观察误杀率。

    生产热切换禁止在未完成 Shadow 报告时执行。'
