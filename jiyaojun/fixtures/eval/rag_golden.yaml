corpus:
- id: doc_api_timeout
  kind: doc
  org_domain: eng
  classification: internal
  acl:
  - u_pm
  - u_dev_a
  title: 接口超时规范
  body: '# 接口超时与重试


    ## 超时阈值

    网关对外接口超时阈值为 3 秒。


    ## 重试策略

    最多重试 2 次，仅对幂等 GET。

    半成功场景必须写入补偿任务队列。


    ## 监控

    超时率超过 1% 触发告警。'
