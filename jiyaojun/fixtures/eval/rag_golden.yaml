  - u_dev_a
  title: 支付切流评审转写
  write_class: domain
  series_id: series_pay
  segments:
  - speaker: 张三
    text: 本周支付切流压测还没出结论，网关容量是红灯。
    start_ms: 0
    end_ms: 4200
    section: 压测
  - speaker: 李四
    text: 建议先灰度 5% 流量，观察超时与重试指标。
    start_ms: 4300
    end_ms: 9100
    section: 讨论
  - speaker: 王五
    text: 上次会议决议是压测通过前不切流，这条要继续跟进。
    start_ms: 9200
    end_ms: 14000
    section: 决议
  - speaker: 张三
    text: 补偿任务队列本周已补齐，半成功不会再丢单。
    start_ms: 14100
    end_ms: 18500
    section: 补偿
