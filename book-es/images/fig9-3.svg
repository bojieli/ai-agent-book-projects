<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" style="background:#ffffff">
  <defs>
    <style>
      .t{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#26343c}
      .h{font-size:20px;font-weight:700}
      .s{font-size:16px;fill:#52636d}
      .box{fill:#f5f7f8;stroke:#33434d;stroke-width:2}
      .accent{fill:#e8f1f5;stroke:#2f617a;stroke-width:2}
    </style>
  </defs>
  <text x="500" y="30" text-anchor="middle" class="t h">Cómo se representa una capacidad decide dónde se actualiza</text>

  <rect x="35" y="72" width="220" height="126" rx="9" class="box"/>
  <text x="145" y="105" text-anchor="middle" class="t h">Conocimiento</text>
  <text x="145" y="135" text-anchor="middle" class="t s" style="font-size:13.5px">Hechos, experiencia, excepciones</text>
  <text x="145" y="164" text-anchor="middle" class="t s" style="font-size:13.5px">Markdown / base de conocimiento</text>

  <rect x="275" y="72" width="220" height="126" rx="9" class="box"/>
  <text x="385" y="105" text-anchor="middle" class="t h">Instrucciones</text>
  <text x="385" y="135" text-anchor="middle" class="t s" style="font-size:10.5px">Principios de juicio expresables en palabras</text>
  <text x="385" y="164" text-anchor="middle" class="t s">Prompt / Skill</text>

  <rect x="515" y="72" width="220" height="126" rx="9" class="box"/>
  <text x="625" y="105" text-anchor="middle" class="t h">Programas</text>
  <text x="625" y="135" text-anchor="middle" class="t s" style="font-size:10.5px">Flujos deterministas y restricciones fuertes</text>
  <text x="625" y="164" text-anchor="middle" class="t s" style="font-size:15px">Herramientas / Flujo / Harness</text>

  <rect x="755" y="72" width="220" height="126" rx="9" class="accent"/>
  <text x="865" y="105" text-anchor="middle" class="t h">Parámetros</text>
  <text x="865" y="135" text-anchor="middle" class="t s" style="font-size:9px">Percepción de alta dimensión y política implícita</text>
  <text x="865" y="164" text-anchor="middle" class="t s">SFT / Destilación / RL</text>

  <line x1="145" y1="226" x2="865" y2="226" stroke="#33434d" stroke-width="2"/>
  <path d="M145 218 V234 M865 218 V234" stroke="#33434d" stroke-width="2"/>
  <text x="145" y="260" text-anchor="middle" class="t s">Fácil de actualizar y trazable</text>
  <text x="865" y="260" text-anchor="middle" class="t s" style="font-size:15px">Interiorizado, bajo coste de inferencia</text>
  <text x="500" y="289" text-anchor="middle" class="t h">No es una escalera de un solo sentido sino cuatro soportes complementarios</text>

  <rect x="145" y="320" width="710" height="58" rx="8" class="accent"/>
  <text x="500" y="344" text-anchor="middle" class="t h" style="font-size:17px">Primera pregunta: ¿puede expresarse por completo como hechos, reglas o programas?</text>
  <text x="500" y="367" text-anchor="middle" class="t s">La estabilidad, el coste y la frecuencia deciden el despliegue, no si puede parametrizarse</text>
</svg>
