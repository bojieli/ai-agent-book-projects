<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" style="background:#ffffff">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#33434d"/>
    </marker>
    <style>
      .t{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#26343c}
      .h{font-size:20px;font-weight:700}
      .s{font-size:15px;fill:#52636d}
      .box{fill:#f5f7f8;stroke:#33434d;stroke-width:2}
      .accent{fill:#e8f1f5;stroke:#2f617a;stroke-width:2}
      .line{fill:none;stroke:#33434d;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>

  <text x="500" y="28" text-anchor="middle" class="t h">Evolución continua: de la experiencia de ejecución a una nueva versión del Agent</text>

  <rect x="25" y="72" width="150" height="90" rx="8" class="box"/>
  <text x="100" y="105" text-anchor="middle" class="t h">Ejecutar tarea</text>
  <text x="100" text-anchor="middle" class="t s" y="127.04" style="font-size:12px">Interacción con usuarios,</text><text x="100" text-anchor="middle" class="t s" y="140.96" style="font-size:12px">entorno y herramientas</text>

  <rect x="205" y="72" width="150" height="90" rx="8" class="box"/>
  <text x="280" y="105" text-anchor="middle" class="t h" style="font-size:14px">Registrar trayectoria</text>
  <text x="280" text-anchor="middle" class="t s" y="125.59" style="font-size:14.5px">Acciones, resultados</text><text x="280" text-anchor="middle" class="t s" y="142.41" style="font-size:14.5px">y retroalimentación</text>

  <rect x="385" y="72" width="150" height="90" rx="8" class="accent"/>
  <text x="460" y="105" text-anchor="middle" class="t h" style="font-size:18.5px">Formar señales</text>
  <text x="460" y="134" text-anchor="middle" class="t s" style="font-size:10px">Resultado · Proceso · Calidad</text>

  <rect x="565" y="55" width="230" height="124" rx="8" class="accent"/>
  <text x="680" y="84" text-anchor="middle" class="t h" style="font-size:13px">Generar actualizaciones candidatas</text>
  <rect x="582" y="102" width="92" height="27" rx="5" fill="#ffffff" stroke="#66808e"/>
  <rect x="686" y="102" width="92" height="27" rx="5" fill="#ffffff" stroke="#66808e"/>
  <rect x="582" y="139" width="92" height="27" rx="5" fill="#ffffff" stroke="#66808e"/>
  <rect x="686" y="139" width="92" height="27" rx="5" fill="#ffffff" stroke="#66808e"/>
  <text x="628" y="121" text-anchor="middle" class="t s" style="font-size:12.5px">Conocimiento</text>
  <text x="732" y="121" text-anchor="middle" class="t s" style="font-size:13px">Instrucciones</text>
  <text x="628" y="158" text-anchor="middle" class="t s">Programas</text>
  <text x="732" y="158" text-anchor="middle" class="t s">Parámetros</text>

  <rect x="825" y="72" width="150" height="90" rx="8" class="box"/>
  <text x="900" y="105" text-anchor="middle" class="t h" style="font-size:16.5px">Validar y publicar</text>
  <text x="900" text-anchor="middle" class="t s" y="126.17" style="font-size:13.5px">Regresión, despliegue</text><text x="900" text-anchor="middle" class="t s" y="141.83" style="font-size:13.5px">gradual y reversión</text>

  <path d="M175 117 H203" class="line"/>
  <path d="M355 117 H383" class="line"/>
  <path d="M535 117 H563" class="line"/>
  <path d="M795 117 H823" class="line"/>

  <path d="M900 162 V238 H100 V164" class="line" stroke-dasharray="7 5"/>
  <text x="500" y="265" text-anchor="middle" class="t h">El nuevo Agent entra en la siguiente ronda</text>
  <text x="500" y="294" text-anchor="middle" class="t s">Solo las actualizaciones que cambian el comportamiento posterior y superan la validación constituyen evolución continua</text>
  <line x1="260" y1="318" x2="740" y2="318" stroke="#9aa8af" stroke-width="1"/>
</svg>
