<text x="140" y="350" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">Codificación one-hot + multi-hot</text>
<text x="140" y="370" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">+ transf. logarítmica + estandariz.</text>
<line x1="240" y1="342" x2="278" y2="342" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
<rect x="280" y="310" width="200" height="65" rx="6" fill="#d0d0d0" stroke="#333333" stroke-width="2"/>
