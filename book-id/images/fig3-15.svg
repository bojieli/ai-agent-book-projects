<text x="400" y="463" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">Pandu Pertanyaan berdasar Pentingnya Faktor → Ambil Prototipe Kasus Serupa → Analisis Hukuman Berbasis Data</text>
