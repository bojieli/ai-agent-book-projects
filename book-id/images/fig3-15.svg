<text x="240" y="212" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">Skema Inti (menyerahkan_diri/kompensasi/hukuman_sebelumnya) + Skema Ekstensi Khusus Kejahatan</text>
