<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" style="background:#ffffff">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#33434d"/></marker>
    <style>
      .t{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#26343c}
      .h{font-size:19px;font-weight:700}
      .s{font-size:15px;fill:#52636d}
      .box{fill:#f5f7f8;stroke:#33434d;stroke-width:2}
      .accent{fill:#e8f1f5;stroke:#2f617a;stroke-width:2}
      .line{fill:none;stroke:#33434d;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="500" y="30" text-anchor="middle" class="t h">Mengubah pengalaman jadi pengetahuan: trajektori adalah bukti, dokumen adalah unit pakai ulang</text>

  <rect x="22" y="78" width="168" height="96" rx="8" class="box"/>
  <text x="106" y="111" text-anchor="middle" class="t h" style="font-size:18.5px">Trajektori mentah</text>
  <text x="106" y="139" text-anchor="middle" class="t s">Aksi, hasil, lingkungan</text>
  <text x="106" y="160" text-anchor="middle" class="t s">Bukti yang tak berubah</text>

  <rect x="215" y="78" width="168" height="96" rx="8" class="box"/>
  <text x="299" y="111" text-anchor="middle" class="t h">Evaluasi tunggal</text>
  <text x="299" y="139" text-anchor="middle" class="t s">Berhasil, gagal, label</text>
  <text x="299" y="160" text-anchor="middle" class="t s">Menyimpan letak bukti</text>

  <rect x="408" y="63" width="184" height="126" rx="8" class="accent"/>
  <text x="500" y="97" text-anchor="middle" class="t h" style="font-size:12.5px">Perbandingan antar trajektori</text>
  <text x="500" y="128" text-anchor="middle" class="t s">Kumpulkan tugas sejenis</text>
  <text x="500" y="151" text-anchor="middle" class="t s" style="font-size:12px">Bandingkan berhasil dan gagal</text>
  <text x="500" y="174" text-anchor="middle" class="t s" style="font-size:12.5px">Tarik kesamaan dan batasnya</text>

  <rect x="617" y="63" width="184" height="126" rx="8" class="accent"/>
  <text x="709" y="97" text-anchor="middle" class="t h" style="font-size:17.5px">Dokumen Markdown</text>
  <text x="709" y="128" text-anchor="middle" class="t s" style="font-size:11.5px">Skenario penerapan dan strategi</text>
  <text x="709" y="151" text-anchor="middle" class="t s" style="font-size:10px">Pengecualian, area terlarang, sumber</text>
  <text x="709" y="174" text-anchor="middle" class="t s">Versi dan waktu verifikasi</text>

  <rect x="826" y="78" width="152" height="96" rx="8" class="box"/>
  <text x="902" y="111" text-anchor="middle" class="t h" style="font-size:15px">Ambil dan terapkan</text>
  <text x="902" text-anchor="middle" class="t s" y="130.88" style="font-size:14px">Muat sesuai</text><text x="902" text-anchor="middle" class="t s" y="147.12" style="font-size:14px">kebutuhan tugas baru</text>
  <text x="902" y="160" text-anchor="middle" class="t s" style="font-size:9px">Terus menghasilkan umpan balik</text>

  <path d="M190 126 H213" class="line"/>
  <path d="M383 126 H406" class="line"/>
  <path d="M592 126 H615" class="line"/>
  <path d="M801 126 H824" class="line"/>

  <path d="M902 174 V244 H500 V191" class="line" stroke-dasharray="7 5"/>
  <text x="700" y="270" text-anchor="middle" class="t s">Bukti baru merevisi, membatasi, atau memensiunkan pengetahuan lama</text>

  <rect x="215" y="302" width="586" height="48" rx="8" fill="#fafbfb" stroke="#9aa8af"/>
  <text x="508" y="332" text-anchor="middle" class="t s" style="font-size:10px">Berbagi infrastruktur ekstraksi dan pencarian dengan Bab 3; bab ini menambah evaluasi trajektori dan lingkar perbaikan perilaku</text>
</svg>
