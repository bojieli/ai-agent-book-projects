<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 920 400" width="920" height="400" style="background:#ffffff">
<defs><marker id="ah" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#333333"/></marker><marker id="ah-light" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#999999"/></marker></defs>
<rect x="40" y="70" width="400" height="46" rx="6" fill="#d0d0d0" stroke="#333333" stroke-width="2"/>
<text x="240" y="93" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold">Memori pengguna (skala individu)</text>
<rect x="480" y="70" width="400" height="46" rx="6" fill="#d0d0d0" stroke="#333333" stroke-width="2"/>
<text x="680" y="93" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold">Basis pengetahuan (skala kelompok)</text>
<rect x="40" y="128" width="400" height="158" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<text x="60" y="156" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal">· Hierarki memori · Evaluasi tiga tingkat</text>
<text x="60" y="184" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal">· Empat format penyimpanan</text>
<text x="60" y="212" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal">· Tipe kognitif: episodik · semantik · prosedural</text>
<text x="60" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal">· Kerangka memori: Mem0 · Memobase</text>
<text x="60" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal">· Kompresi dan konsolidasi · Pemeringkatan privasi</text>
<rect x="480" y="128" width="400" height="158" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<text x="500" y="156" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal">· Pemenggalan dokumen · Ekstraksi multimodal</text>
<text x="500" y="184" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal">· Embedding padat/jarang · Pencarian hibrida</text>
<text x="500" y="212" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal">· Pengindeksan terstruktur: RAPTOR · GraphRAG</text>
<text x="500" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal">· Paradigma sistem berkas · RAG agentik</text>
<text x="500" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal">· Pencarian kontekstual · Ekstraksi pengetahuan mendalam</text>
<line x1="240" y1="320" x2="240" y2="288" stroke="#999999" stroke-width="2" marker-end="url(#ah-light)"/>
<line x1="680" y1="320" x2="680" y2="288" stroke="#999999" stroke-width="2" marker-end="url(#ah-light)"/>
<rect x="40" y="322" width="840" height="50" rx="6" fill="#f5f5f5" stroke="#999999" stroke-width="2"/>
<text x="460" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold">Fondasi bersama: teknik pencarian</text>
<text x="460" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">Pemenggalan dokumen · Embedding vektor/kata kunci · Pencarian hibrida · Pemeringkatan ulang</text>
<text x="460" y="397" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">Kedua alur akhirnya bertemu dalam “arsitektur memori dua lapis”:</text>
<text x="460" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">Kartu JSON lanjutan menjaga ikhtisar tetap tersedia; pencarian kontekstual mengambil detail sesuai kebutuhan.</text>
</svg>
