<text x="542.5" y="118" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" dominant-baseline="central" font-weight="bold">Vektor</text>
<rect x="447.5" y="146" width="190" height="230" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="2" />
<text x="457.5" y="165" font-family="'Courier New', Courier, monospace" font-size="9" fill="#333333" text-anchor="start" dominant-baseline="central">Akurasi kueri informasi 9/10</text>
<text x="457.5" y="191" font-family="'Courier New', Courier, monospace" font-size="7" fill="#333333" text-anchor="start" dominant-baseline="central">Kelengkapan pengumpulan informasi 6/10</text>
<text x="457.5" y="217" font-family="'Courier New', Courier, monospace" font-size="11" fill="#333333" text-anchor="start" dominant-baseline="central">Kelancaran komunikasi 8/10</text>
<text x="457.5" y="243" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#333333" text-anchor="start" dominant-baseline="central">Akurasi komunikasi 7/10</text>
<text x="457.5" y="269" font-family="'Courier New', Courier, monospace" font-size="8.5" fill="#333333" text-anchor="start" dominant-baseline="central">Akurasi komunikasi pengguna 10/10</text>
<text x="457.5" y="295" font-family="'Courier New', Courier, monospace" font-size="10" fill="#333333" text-anchor="start" dominant-baseline="central">Penyelesaian tugas keseluruhan 8/10</text>
<text x="457.5" y="321" font-family="'Courier New', Courier, monospace" font-size="12" fill="#333333" text-anchor="start" dominant-baseline="central">─────────</text>
<text x="457.5" y="343" font-family="'Courier New', Courier, monospace" font-size="9" fill="#333333" text-anchor="start" dominant-baseline="central">Melokalkan kekurangan dengan tepat ↑</text>
<line x1="639.5" y1="250" x2="650.5" y2="250" stroke="#333333" stroke-width="2" marker-end="url(#ah)" />
<rect x="652.5" y="100" width="190" height="36" rx="6" fill="#999999" stroke="#333333" stroke-width="2" />
<text x="747.5" y="118" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" dominant-baseline="central" font-weight="bold">Generatif</text>
<rect x="652.5" y="146" width="190" height="210" rx="6" fill="#d0d0d0" stroke="#333333" stroke-width="2" />
<text x="662.5" y="165" font-family="'Courier New', Courier, monospace" font-size="9" fill="#333333" text-anchor="start" dominant-baseline="central">Perspektif 1: Penggunaan tool yang akurat</text>
<text x="662.5" y="191" font-family="'Courier New', Courier, monospace" font-size="6.5" fill="#333333" text-anchor="start" dominant-baseline="central">Perspektif 2: Pengumpulan informasi hilang</text>
<text x="662.5" y="217" font-family="'Courier New', Courier, monospace" font-size="7.5" fill="#333333" text-anchor="start" dominant-baseline="central">Perspektif 3: Parafrase nama paket</text>
<text x="662.5" y="243" font-family="'Courier New', Courier, monospace" font-size="8" fill="#333333" text-anchor="start" dominant-baseline="central">  Kesalahan → Sarankan pengulangan langsung</text>
<text x="662.5" y="269" font-family="'Courier New', Courier, monospace" font-size="6" fill="#333333" text-anchor="start" dominant-baseline="central">Perspektif 4: Tidak menjelaskan penggunaan informasi</text>
<text x="662.5" y="295" font-family="'Courier New', Courier, monospace" font-size="6.5" fill="#333333" text-anchor="start" dominant-baseline="central">Perspektif 5: Tidak memverifikasi identitas agent</text>
<text x="662.5" y="321" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#333333" text-anchor="start" dominant-baseline="central">→ 6-7 perspektif analisis</text>
<line x1="132.5" y1="368" x2="747.5" y2="368" stroke="#333333" stroke-width="2" marker-end="url(#ah)" />
<text x="440.0" y="388" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="bold">Peningkatan informasi →</text>
<rect x="60" y="405" width="760" height="55" rx="4" fill="#f5f5f5" stroke="#999999" stroke-width="2" />
<text x="80" y="420" font-family="'Courier New', Courier, monospace" font-size="15" fill="#333333" text-anchor="start" dominant-baseline="central">Eksperimen DeepSeek: 8 evaluasi Generatif menghasilkan 6-7 perspektif analitik</text>
<text x="80" y="442" font-family="'Courier New', Courier, monospace" font-size="9" fill="#333333" text-anchor="start" dominant-baseline="central">Peningkatan signifikan setelah diagnosis komprehensif dari berbagai sudut (ilustratif) — mempelajari arah peningkatan dari satu kegagalan</text>
<rect x="60" y="475" width="760" height="45" rx="6" fill="#999999" stroke="#333333" stroke-width="2" />
<text x="440.0" y="498" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" dominant-baseline="central" font-weight="bold">Reward generatif: mengubah feedback lingkungan yang kaya menjadi pengetahuan yang dapat dipelajari tanpa ratusan uji coba dan kesalahan</text>
</svg>