<rect x="242.5" y="146" width="190" height="210" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="2" />
<text x="252.5" y="165" font-family="'Courier New', Courier, monospace" font-size="9" fill="#333333" text-anchor="start" dominant-baseline="central">Baik: Menemukan nomor telepon yang benar</text>
<text x="252.5" y="191" font-family="'Courier New', Courier, monospace" font-size="7.5" fill="#333333" text-anchor="start" dominant-baseline="central">Baik: Berhasil menyelesaikan perubahan</text>
<text x="252.5" y="217" font-family="'Courier New', Courier, monospace" font-size="10" fill="#333333" text-anchor="start" dominant-baseline="central">Buruk: Alamat penagihan hilang</text>
<text x="252.5" y="243" font-family="'Courier New', Courier, monospace" font-size="12" fill="#333333" text-anchor="start" dominant-baseline="central">Buruk: Nama paket salah</text>
<text x="252.5" y="269" font-family="'Courier New', Courier, monospace" font-size="12" fill="#333333" text-anchor="start" dominant-baseline="central">─────────</text>
<text x="252.5" y="295" font-family="'Courier New', Courier, monospace" font-size="12" fill="#333333" text-anchor="start" dominant-baseline="central">Keseluruhan: 6.5 poin</text>
<text x="252.5" y="321" font-family="'Courier New', Courier, monospace" font-size="8" fill="#333333" text-anchor="start" dominant-baseline="central">(Berdasarkan bukti tetapi terlalu umum)</text>
