<text x="135" y="73" font-family="'Courier New', Courier, monospace" font-size="12" fill="#333333" text-anchor="start" dominant-baseline="central">Tugas: Perubahan paket Xfinity | Masalah: Alamat penagihan hilang + Nama paket salah</text>
