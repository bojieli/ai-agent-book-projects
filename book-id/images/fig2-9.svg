<text x="50" y="98" font-family="'Courier New', Courier, monospace" font-size="9" fill="#333333" text-anchor="start" dominant-baseline="central">&quot;Saya seorang insinyur senior di TechCorp, memimpin tim 5 orang untuk membangun sistem rekomendasi, menggunakan ML selama tiga tahun&quot;</text>
