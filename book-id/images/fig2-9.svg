<text x="150" y="574" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.2" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold">Tingkat 3: Layanan Proaktif</text>
<text x="252" y="567" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal">Integrasikan berbagai memori, bantuan antisipatif</text>
<text x="252" y="584" font-family="'Courier New', Courier, monospace" font-size="12" fill="#333333" text-anchor="start" dominant-baseline="central">Pesan penerbangan internasional → Temukan paspor akan segera kedaluwarsa</text>
