<text x="252" y="477" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal">Simpan dan ambil informasi langsung</text>
<text x="252" y="494" font-family="'Courier New', Courier, monospace" font-size="12" fill="#333333" text-anchor="start" dominant-baseline="central">&quot;Nomor keanggotaan saya 12345&quot; → Pengembalian eksak</text>
<rect x="60" y="510" width="180" height="38" rx="4" fill="#e8e8e8" stroke="#333333" stroke-width="2"/>
<text x="150" y="529" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.1" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold">Tingkat 2: Pengambilan Multi-sesi</text>
<text x="252" y="522" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal">Penalaran asosiatif lintas-sesi</text>
<text x="252" y="539" font-family="'Courier New', Courier, monospace" font-size="12" fill="#333333" text-anchor="start" dominant-baseline="central">&quot;Jadwalkan perawatan untuk mobil saya&quot; → Identifikasi dua mobil</text>
