<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 512" width="880" height="512" style="background:#ffffff">
<defs>
<marker id="ah" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 12 4, 0 8" fill="#333333"/></marker>
<marker id="ah-s" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 10 3.5, 0 7" fill="#666666"/></marker>
<marker id="ah-r" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="10 0, 0 3.5, 10 7" fill="#666666"/></marker>
</defs>
<style>
.t{font-family:Arial,'Helvetica Neue',Helvetica,'PingFang SC','Microsoft YaHei',sans-serif;fill:#333333;text-anchor:middle;dominant-baseline:central}
.l{font-family:Arial,'Helvetica Neue',Helvetica,'PingFang SC','Microsoft YaHei',sans-serif;fill:#333333;text-anchor:start;dominant-baseline:central}
.h{font-size:17px;font-weight:bold}
.m{font-size:14px}
.n{font-size:12.5px;fill:#666666}
.c{font-size:12.5px;fill:#666666;font-family:'SF Mono',Menlo,Consolas,monospace}
</style>

<!-- 使用者模擬器 -->
<rect x="40" y="20" width="270" height="86" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<text class="t h" x="175" y="40">使用者模擬器（LLM）</text>
<text class="l n" x="56" y="62">known_info：John Smith / 555-123-2002 / 在法國</text>
<text class="l n" x="56" y="80">task_instructions：漸進透露 · 情緒 · 事實錨定</text>
<text class="l n" x="56" y="96">驗收口徑：僅 excellent 算解決</text>

<!-- Agent -->
<rect x="570" y="20" width="270" height="86" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<text class="t h" x="705" y="40">Agent（待評估）</text>
<text class="l n" x="586" y="62">輸入：工單 + 領域政策</text>
<text class="l n" x="586" y="80">不可見：使用者裝置的真實狀態</text>
<text class="l n" x="586" y="96">只能引導使用者操作，無法代其執行</text>

<!-- 對話 -->
<line x1="316" y1="63" x2="560" y2="63" stroke="#666666" stroke-width="1.5" marker-end="url(#ah-s)" marker-start="url(#ah-r)"/>
<text class="t n" x="438" y="50">多輪對話</text>
<text class="t n" x="438" y="80">漸進式資訊透露</text>

<!-- 共享環境 -->
<rect x="40" y="146" width="800" height="150" rx="6" fill="#f3f0e8" stroke="#333333" stroke-width="2"/>
<text class="t h" x="440" y="166">共享環境（雙控：兩側都能改寫狀態）</text>
<rect x="60" y="182" width="370" height="98" rx="5" fill="#ffffff" stroke="#666666" stroke-width="1.5"/>
<text class="t m" x="245" y="200" font-weight="bold">裝置側狀態</text>
<text class="l n" x="76" y="222">飛航模式 ON · 資料漫遊 OFF · 省流模式 · 剩餘流量</text>
<text class="l c" x="76" y="246">使用者工具：toggle_airplane_mode / toggle_roaming</text>
<text class="l c" x="76" y="266">　　　　　check_status_bar / run_speed_test</text>
<rect x="450" y="182" width="370" height="98" rx="5" fill="#ffffff" stroke="#666666" stroke-width="1.5"/>
<text class="t m" x="635" y="200" font-weight="bold">運營商側資料庫</text>
<text class="l n" x="466" y="222">客戶 C1001 · 線路 L1001/L1002/L1003 · 套餐 · 賬單</text>
<text class="l c" x="466" y="246">Agent 工具：get_customer_by_phone / get_data_usage</text>
<text class="l c" x="466" y="266">　　　　　　enable_roaming / refuel_data</text>

<line x1="175" y1="106" x2="175" y2="178" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
<line x1="705" y1="106" x2="705" y2="178" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>

<!-- 回讀提示 -->
<rect x="40" y="306" width="800" height="34" rx="5" fill="#ffffff" stroke="#666666" stroke-width="1.5" stroke-dasharray="5 4"/>
<text class="t n" x="440" y="323">使用者執行 toggle_roaming 後環境已改變，Agent 必須重新呼叫工具才能獲知結果——驗證因此覆蓋 「是否讀到了使用者側的操作結果」</text>

<!-- 驗證 -->
<rect x="40" y="356" width="800" height="136" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<text class="t h" x="440" y="376">任務結束後：四層檢查 + 聚合規則</text>
<rect x="56" y="392" width="182" height="62" rx="5" fill="#ffffff" stroke="#666666" stroke-width="1.5"/>
<text class="t m" x="147" y="408">env_assertions</text>
<text class="t n" x="147" y="428">移動資料可用</text>
<text class="t n" x="147" y="444">測速 ≥ 200 / excellent</text>
<rect x="254" y="392" width="182" height="62" rx="5" fill="#ffffff" stroke="#666666" stroke-width="1.5"/>
<text class="t m" x="345" y="408">actions</text>
<text class="t n" x="345" y="428">toggle_airplane_mode</text>
<text class="t n" x="345" y="444">requestor 必須為 user</text>
<rect x="452" y="392" width="182" height="62" rx="5" fill="#ffffff" stroke="#666666" stroke-width="1.5"/>
<text class="t m" x="543" y="408">communicate_info</text>
<text class="t n" x="543" y="428">必要資訊是否告知</text>
<text class="t n" x="543" y="444">本題為 null</text>
<rect x="650" y="392" width="182" height="62" rx="5" fill="#ffffff" stroke="#666666" stroke-width="1.5"/>
<text class="t m" x="741" y="408">nl_assertions</text>
<text class="t n" x="741" y="428">自然語言層判定</text>
<text class="t n" x="741" y="444">本題為 null</text>
<text class="t n" x="440" y="474">reward_basis = ["ENV_ASSERTION"]　→　僅採信第一層；其餘各層照常記錄但不計入獎勵</text>
</svg>
