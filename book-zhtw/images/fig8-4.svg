<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" style="background:#ffffff">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#33434d"/></marker>
    <style>
      .t{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#26343c}
      .h{font-size:19px;font-weight:700}
      .s{font-size:15px;fill:#52636d}
      .box{fill:#f5f7f8;stroke:#33434d;stroke-width:2}
      .accent{fill:#e8f1f5;stroke:#2f617a;stroke-width:2}
      .line{fill:none;stroke:#33434d;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="500" y="30" text-anchor="middle" class="t h">經驗知識化：原始軌跡是證據，知識文件才是複用單元</text>

  <rect x="22" y="78" width="168" height="96" rx="8" class="box"/>
  <text x="106" y="111" text-anchor="middle" class="t h">原始軌跡</text>
  <text x="106" y="139" text-anchor="middle" class="t s">動作、結果、環境</text>
  <text x="106" y="160" text-anchor="middle" class="t s">不可變證據</text>

  <rect x="215" y="78" width="168" height="96" rx="8" class="box"/>
  <text x="299" y="111" text-anchor="middle" class="t h">單次評價</text>
  <text x="299" y="139" text-anchor="middle" class="t s">成功、失敗、標籤</text>
  <text x="299" y="160" text-anchor="middle" class="t s">保留證據位置</text>

  <rect x="408" y="63" width="184" height="126" rx="8" class="accent"/>
  <text x="500" y="97" text-anchor="middle" class="t h">跨軌跡比較</text>
  <text x="500" y="128" text-anchor="middle" class="t s">聚合同類任務</text>
  <text x="500" y="151" text-anchor="middle" class="t s">對照成功與失敗</text>
  <text x="500" y="174" text-anchor="middle" class="t s">提取共性與邊界</text>

  <rect x="617" y="63" width="184" height="126" rx="8" class="accent"/>
  <text x="709" y="97" text-anchor="middle" class="t h">Markdown 文件</text>
  <text x="709" y="128" text-anchor="middle" class="t s">適用場景與策略</text>
  <text x="709" y="151" text-anchor="middle" class="t s">例外、禁區與來源</text>
  <text x="709" y="174" text-anchor="middle" class="t s">版本與驗證時間</text>

  <rect x="826" y="78" width="152" height="96" rx="8" class="box"/>
  <text x="902" y="111" text-anchor="middle" class="t h">檢索應用</text>
  <text x="902" y="139" text-anchor="middle" class="t s">新任務按需載入</text>
  <text x="902" y="160" text-anchor="middle" class="t s">繼續產生回饋</text>

  <path d="M190 126 H213" class="line"/>
  <path d="M383 126 H406" class="line"/>
  <path d="M592 126 H615" class="line"/>
  <path d="M801 126 H824" class="line"/>

  <path d="M902 174 V244 H500 V191" class="line" stroke-dasharray="7 5"/>
  <text x="700" y="270" text-anchor="middle" class="t s">新證據用於修訂、限定或淘汰舊知識</text>

  <rect x="215" y="302" width="586" height="48" rx="8" fill="#fafbfb" stroke="#9aa8af"/>
  <text x="508" y="332" text-anchor="middle" class="t s">與第三章共用抽取和檢索基礎設施；本章新增軌跡評價與行為改進閉環</text>
</svg>
