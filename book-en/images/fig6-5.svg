<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540">
  <title>Figure 6-5: Synchronous-Interface Compatibility and Model-Native Asynchrony</title>
  <desc>In the compatibility approach above, the runtime orders incoming events so that a model with a synchronous interface can participate in asynchronous tasks. Another approach lets the model understand this interaction rhythm natively: it can do other work while a tool runs and adjust subsequent work when the user adds requirements midway. GPT-6 Astra already supports Async tool calling and Mid-turn steering, illustrating this change (Figure 6-5).</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#555" /></marker>
    <style>
      text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#333}
      .title{font-size:20px;font-weight:700}
      .label{font-size:17px;font-weight:600}
      .small{font-size:15px}
      .box{fill:#f4f4f4;stroke:#555;stroke-width:1.5}
      .arrow{fill:none;stroke:#555;stroke-width:1.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="880" height="540" fill="#fff" />
  <rect x="20" y="20" width="840" height="145" rx="8" fill="#fff" stroke="#777" stroke-dasharray="7 4" />
  <text x="40" y="53" class="title">Compatibility: the runtime schedules asynchronous work</text>
  <rect x="40" y="75" width="230" height="60" rx="5" class="box" />
  <text x="155" y="100" text-anchor="middle" class="label" style="font-size:15.45px">Task runs in the background</text>
  <text x="155" y="122" text-anchor="middle" class="small">Explicitly marked unfinished</text>
  <path d="M270 105 H313" class="arrow" />
  <rect x="320" y="75" width="240" height="60" rx="5" class="box" />
  <text x="440" y="100" text-anchor="middle" class="label" style="font-size:15.05px">Runtime receives new events</text>
  <text x="440" y="122" text-anchor="middle" class="small" style="font-size:14.04px">Queue, interrupt, or run in parallel</text>
  <path d="M560 105 H603" class="arrow" />
  <rect x="610" y="75" width="230" height="60" rx="5" class="box" />
  <text x="725" y="100" text-anchor="middle" class="label">Model continues the task</text>
  <text x="725" y="122" text-anchor="middle" class="small" style="font-size:13.35px">Inputs still follow synchronous turns</text>

  <rect x="20" y="185" width="840" height="250" rx="8" fill="#fff" stroke="#444" stroke-width="2" />
  <text x="40" y="218" class="title">Native asynchrony: understanding waits and mid-task changes</text>
  <rect x="40" y="240" width="230" height="65" rx="5" class="box" />
  <text x="155" y="267" text-anchor="middle" class="label">Start a slow query</text>
  <text x="155" y="290" text-anchor="middle" class="small">Example: find meeting venues</text>
  <path d="M270 272 H313" class="arrow" />
  <rect x="320" y="240" width="240" height="65" rx="5" class="box" />
  <text x="440" y="267" text-anchor="middle" class="label" style="font-size:16.08px">Keep working while waiting</text>
  <text x="440" y="290" text-anchor="middle" class="small" style="font-size:14.09px">Prepare the agenda and checklist</text>
  <path d="M560 272 H603" class="arrow" />
  <rect x="610" y="240" width="230" height="65" rx="5" class="box" />
  <text x="725" y="267" text-anchor="middle" class="label" style="font-size:16.57px">Decide when results arrive</text>
  <text x="725" y="290" text-anchor="middle" class="small" style="font-size:14.53px">Compare venues using real data</text>

  <rect x="40" y="340" width="230" height="65" rx="5" class="box" />
  <text x="155" y="367" text-anchor="middle" class="label">User adds requirements</text>
  <text x="155" y="390" text-anchor="middle" class="small">Budget or attendance changes</text>
  <path d="M270 372 H313" class="arrow" />
  <rect x="320" y="340" width="240" height="65" rx="5" class="box" />
  <text x="440" y="367" text-anchor="middle" class="label">Retain completed work</text>
  <text x="440" y="390" text-anchor="middle" class="small" style="font-size:14.09px">Add new requirements to the task</text>
  <path d="M560 372 H603" class="arrow" />
  <rect x="610" y="340" width="230" height="65" rx="5" class="box" />
  <text x="725" y="367" text-anchor="middle" class="label" style="font-size:16.43px">Adjust subsequent actions</text>
  <text x="725" y="390" text-anchor="middle" class="small" style="font-size:14.25px">Use existing data and all updates</text>

  <rect x="20" y="455" width="840" height="65" rx="6" fill="#e9e9e9" />
  <text x="440" y="482" text-anchor="middle" class="label">Model: understand changes and revise plans. Runtime: tools, state, and event sources.</text>
  <text x="440" y="506" text-anchor="middle" class="small">Receiving messages also requires correct task resumption and action control.</text>
</svg>
