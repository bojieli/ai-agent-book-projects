    <text x="444" y="143" text-anchor="middle" font-size="9.5" fill="#626262">Task State · Prompt · Compression</text>

    <line x1="565" y1="128" x2="594" y2="128" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="598" y="92" width="254" height="72" rx="8" fill="#e7e7e7" stroke="#444444" stroke-width="1.6"/>
    <text x="725" y="118" text-anchor="middle" font-size="12.5" font-weight="bold">Ch 3　Memory and Knowledge</text>
    <text x="725" y="143" text-anchor="middle" font-size="9.5" fill="#626262">Cross-session Memory · RAG · Organization</text>

    <rect x="48" y="194" width="242" height="72" rx="8" fill="#e7e7e7" stroke="#444444" stroke-width="1.6"/>
