    <text x="166" y="65" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">Part I　How to Build an Agent</text>

    <rect x="48" y="92" width="242" height="72" rx="8" fill="#d9d9d9" stroke="#3f3f3f" stroke-width="1.7"/>
