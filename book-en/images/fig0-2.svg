    <text x="169" y="245" text-anchor="middle" font-size="9.5" fill="#626262">MCP · Perception and Action · Safety</text>

    <line x1="290" y1="230" x2="319" y2="230" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="323" y="194" width="242" height="72" rx="8" fill="#e7e7e7" stroke="#444444" stroke-width="1.6"/>
    <text x="444" y="220" text-anchor="middle" font-size="12.5" font-weight="bold">Ch 5　Coding Agent</text>
    <text x="444" y="245" text-anchor="middle" font-size="9.5" fill="#626262">Code Generation · Generality · Bootstrapping</text>

    <line x1="565" y1="230" x2="594" y2="230" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="598" y="194" width="254" height="72" rx="8" fill="#d9d9d9" stroke="#3f3f3f" stroke-width="1.7"/>
    <text x="725" y="220" text-anchor="middle" font-size="12.5" font-weight="bold">Ch 6　Interaction</text>
