    <text x="169" y="143" text-anchor="middle" font-size="9.5" fill="#626262">Concepts · ReAct · Harness</text>

    <line x1="290" y1="128" x2="319" y2="128" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
