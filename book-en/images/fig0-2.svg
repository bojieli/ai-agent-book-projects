    <text x="345" y="466" text-anchor="middle" font-size="8" fill="#626262">Improve Model Parameters</text>

    <line x1="440" y1="438" x2="453" y2="438" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="457" y="382" width="190" height="112" rx="8" fill="#d9d9d9" stroke="#3f3f3f" stroke-width="1.7"/>
    <text x="552" y="412" text-anchor="middle" font-size="9" font-weight="bold">Ch 9　Continual Evolution</text>
    <text x="552" y="440" text-anchor="middle" font-size="8" fill="#626262">Experience · Updates · Release and Rollback</text>
    <text x="552" y="466" text-anchor="middle" font-size="8" fill="#626262">Improve Individual Systems</text>

    <line x1="647" y1="438" x2="660" y2="438" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="664" y="382" width="193" height="112" rx="8" fill="#cecece" stroke="#333333" stroke-width="1.8"/>
    <text x="760.5" y="412" text-anchor="middle" font-size="9" font-weight="bold">Ch 10　Multi-Agent Collaboration</text>
    <text x="760.5" y="440" text-anchor="middle" font-size="8" fill="#5d5d5d">Division · Communication · Coordination</text>
    <text x="760.5" y="466" text-anchor="middle" font-size="8" fill="#5d5d5d">Improve Collective Systems</text>

    <text x="450" y="527" text-anchor="middle" font-size="10.5" fill="#666666">Evaluation supplies feedback; post-training, evolution, and collaboration expand capability</text>
