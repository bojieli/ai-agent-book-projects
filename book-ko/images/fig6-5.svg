<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540">
  <title>그림 6-5 동기 인터페이스 호환 방식과 모델의 네이티브 비동기 능력</title>
  <desc>앞선 호환 방식에서는 런타임이 이벤트 유입 순서를 조정해 동기 인터페이스 모델이 비동기 작업에 참여하도록 합니다. 다른 방법은 모델 자체가 이 상호작용 리듬을 이해하게 하는 것입니다. 도구가 실행되는 동안 다른 일을 하고, 사용자가 중간에 요구를 추가하면 이후 작업을 조정할 수 있습니다. GPT-6 Astra는 비동기 도구 호출(Async tool calling)과 턴 도중 지시 변경(Mid-turn steering)을 지원하며 이러한 변화를 보여 줍니다(그림 6-5).</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#555" /></marker>
    <style>
      text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#333}
      .title{font-size:20px;font-weight:700}
      .label{font-size:17px;font-weight:600}
      .small{font-size:15px}
      .box{fill:#f4f4f4;stroke:#555;stroke-width:1.5}
      .arrow{fill:none;stroke:#555;stroke-width:1.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="880" height="540" fill="#fff" />
  <rect x="20" y="20" width="840" height="145" rx="8" fill="#fff" stroke="#777" stroke-dasharray="7 4" />
  <text x="40" y="53" class="title">호환 방식: 런타임이 비동기 진행을 조정</text>
  <rect x="40" y="75" width="230" height="60" rx="5" class="box" />
  <text x="155" y="100" text-anchor="middle" class="label">백그라운드에서 작업 실행</text>
  <text x="155" y="122" text-anchor="middle" class="small">미완료 상태를 명확히 기록</text>
  <path d="M270 105 H313" class="arrow" />
  <rect x="320" y="75" width="240" height="60" rx="5" class="box" />
  <text x="440" y="100" text-anchor="middle" class="label">런타임이 새 이벤트 수신</text>
  <text x="440" y="122" text-anchor="middle" class="small">큐·개입·병렬 처리 선택</text>
  <path d="M560 105 H603" class="arrow" />
  <rect x="610" y="75" width="230" height="60" rx="5" class="box" />
  <text x="725" y="100" text-anchor="middle" class="label">모델이 작업을 계속</text>
  <text x="725" y="122" text-anchor="middle" class="small">입력은 여전히 동기식 턴</text>

  <rect x="20" y="185" width="840" height="250" rx="8" fill="#fff" stroke="#444" stroke-width="2" />
  <text x="40" y="218" class="title">네이티브 비동기: 모델이 대기와 중간 변화를 이해</text>
  <rect x="40" y="240" width="230" height="65" rx="5" class="box" />
  <text x="155" y="267" text-anchor="middle" class="label">오래 걸리는 질의 시작</text>
  <text x="155" y="290" text-anchor="middle" class="small">예: 회의 장소 조회</text>
  <path d="M270 272 H313" class="arrow" />
  <rect x="320" y="240" width="240" height="65" rx="5" class="box" />
  <text x="440" y="267" text-anchor="middle" class="label">기다리는 동안 작업 계속</text>
  <text x="440" y="290" text-anchor="middle" class="small">예: 의제와 준비 목록 작성</text>
  <path d="M560 272 H603" class="arrow" />
  <rect x="610" y="240" width="230" height="65" rx="5" class="box" />
  <text x="725" y="267" text-anchor="middle" class="label">결과 도착 후 결정</text>
  <text x="725" y="290" text-anchor="middle" class="small">실제 정보로 장소 비교</text>

  <rect x="40" y="340" width="230" height="65" rx="5" class="box" />
  <text x="155" y="367" text-anchor="middle" class="label">사용자가 도중에 요구 추가</text>
  <text x="155" y="390" text-anchor="middle" class="small">예: 예산과 인원 변경</text>
  <path d="M270 372 H313" class="arrow" />
  <rect x="320" y="340" width="240" height="65" rx="5" class="box" />
  <text x="440" y="367" text-anchor="middle" class="label">완료된 작업 보존</text>
  <text x="440" y="390" text-anchor="middle" class="small">새 요구를 현재 작업에 반영</text>
  <path d="M560 372 H603" class="arrow" />
  <rect x="610" y="340" width="230" height="65" rx="5" class="box" />
  <text x="725" y="367" text-anchor="middle" class="label">이후 행동 조정</text>
  <text x="725" y="390" text-anchor="middle" class="small">기존 정보와 모든 갱신 종합</text>

  <rect x="20" y="455" width="840" height="65" rx="6" fill="#e9e9e9" />
  <text x="440" y="482" text-anchor="middle" class="label">모델은 변화를 이해하고 계획을 조정하며, 런타임은 도구 실행·상태·이벤트 출처를 관리</text>
  <text x="440" y="506" text-anchor="middle" class="small">메시지 수신과 함께 올바른 작업 재개와 실제 행동 제어도 필요합니다.</text>
</svg>
