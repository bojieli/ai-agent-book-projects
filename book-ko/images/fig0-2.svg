<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" style="background:#ffffff">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#666666"/>
    </marker>
  </defs>
  <g font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#2f2f2f">
    <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold">책의 구조</text>

    <!-- Part I: Build an Agent -->
    <rect x="24" y="58" width="852" height="238" rx="12" fill="#fafafa" stroke="#777777" stroke-width="1.7"/>
    <rect x="54" y="46" width="224" height="27" rx="13.5" fill="#505050"/>
    <text x="166" y="65" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">제1부　에이전트 구축</text>

    <rect x="48" y="92" width="242" height="72" rx="8" fill="#d9d9d9" stroke="#3f3f3f" stroke-width="1.7"/>
    <text x="169" y="118" text-anchor="middle" font-size="12.5" font-weight="bold">제1장　AI 에이전트 입문</text>
    <text x="169" y="143" text-anchor="middle" font-size="9.5" fill="#626262">개념 · ReAct · 하네스</text>

    <line x1="290" y1="128" x2="319" y2="128" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="323" y="92" width="242" height="72" rx="8" fill="#e7e7e7" stroke="#444444" stroke-width="1.6"/>
    <text x="444" y="118" text-anchor="middle" font-size="12.5" font-weight="bold">제2장　컨텍스트 엔지니어링</text>
    <text x="444" y="143" text-anchor="middle" font-size="9.5" fill="#626262">작업 상태 · 프롬프트 · 압축</text>

    <line x1="565" y1="128" x2="594" y2="128" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="598" y="92" width="254" height="72" rx="8" fill="#e7e7e7" stroke="#444444" stroke-width="1.6"/>
    <text x="725" y="118" text-anchor="middle" font-size="12.5" font-weight="bold">제3장　사용자 메모리와 지식</text>
    <text x="725" y="143" text-anchor="middle" font-size="9.5" fill="#626262">세션 간 메모리 · RAG · 지식 구성</text>

    <rect x="48" y="194" width="242" height="72" rx="8" fill="#e7e7e7" stroke="#444444" stroke-width="1.6"/>
    <text x="169" y="220" text-anchor="middle" font-size="12.5" font-weight="bold">제4장　도구</text>
    <text x="169" y="245" text-anchor="middle" font-size="9.5" fill="#626262">MCP · 인식과 실행 · 안전</text>

    <line x1="290" y1="230" x2="319" y2="230" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="323" y="194" width="242" height="72" rx="8" fill="#e7e7e7" stroke="#444444" stroke-width="1.6"/>
    <text x="444" y="220" text-anchor="middle" font-size="12.5" font-weight="bold">제5장　코딩 에이전트</text>
    <text x="444" y="245" text-anchor="middle" font-size="9.5" fill="#626262">코드 생성 · 범용 능력 · 부트스트래핑</text>

    <line x1="565" y1="230" x2="594" y2="230" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="598" y="194" width="254" height="72" rx="8" fill="#d9d9d9" stroke="#3f3f3f" stroke-width="1.7"/>
    <text x="725" y="220" text-anchor="middle" font-size="12.5" font-weight="bold">제6장　상호작용</text>
    <text x="725" y="245" text-anchor="middle" font-size="9.5" fill="#626262">관찰·행동 공간의 확장</text>

    <line x1="450" y1="296" x2="450" y2="332" stroke="#555555" stroke-width="1.8" marker-end="url(#arrow)"/>

    <!-- Part II: Improve Agent capabilities -->
    <rect x="24" y="335" width="852" height="211" rx="12" fill="#fafafa" stroke="#666666" stroke-width="1.8"/>
    <rect x="54" y="323" width="245" height="27" rx="13.5" fill="#424242"/>
    <text x="176.5" y="342" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">제2부　에이전트 능력 향상</text>

    <rect x="43" y="382" width="190" height="112" rx="8" fill="#e8e8e8" stroke="#444444" stroke-width="1.6"/>
    <text x="138" y="412" text-anchor="middle" font-size="9" font-weight="bold">제7장　에이전트 평가</text>
    <text x="138" y="440" text-anchor="middle" font-size="8" fill="#626262">환경 · 지표 · 통계</text>
    <text x="138" y="466" text-anchor="middle" font-size="8" fill="#626262">측정 가능한 피드백 구축</text>

    <line x1="233" y1="438" x2="246" y2="438" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="250" y="382" width="190" height="112" rx="8" fill="#e2e2e2" stroke="#444444" stroke-width="1.6"/>
    <text x="345" y="412" text-anchor="middle" font-size="9" font-weight="bold">제8장　모델 사후 학습</text>
    <text x="345" y="440" text-anchor="middle" font-size="8" fill="#626262">SFT · RL · 보상 설계</text>
    <text x="345" y="466" text-anchor="middle" font-size="8" fill="#626262">모델 파라미터 능력 향상</text>

    <line x1="440" y1="438" x2="453" y2="438" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="457" y="382" width="190" height="112" rx="8" fill="#d9d9d9" stroke="#3f3f3f" stroke-width="1.7"/>
    <text x="552" y="412" text-anchor="middle" font-size="9" font-weight="bold">제9장　지속적 진화</text>
    <text x="552" y="440" text-anchor="middle" font-size="8" fill="#626262">경험 · 갱신 · 배포와 롤백</text>
    <text x="552" y="466" text-anchor="middle" font-size="8" fill="#626262">개별 시스템 능력 향상</text>

    <line x1="647" y1="438" x2="660" y2="438" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="664" y="382" width="193" height="112" rx="8" fill="#cecece" stroke="#333333" stroke-width="1.8"/>
    <text x="760.5" y="412" text-anchor="middle" font-size="9" font-weight="bold">제10장　멀티 에이전트 협업</text>
    <text x="760.5" y="440" text-anchor="middle" font-size="8" fill="#5d5d5d">분업 · 통신 · 조정</text>
    <text x="760.5" y="466" text-anchor="middle" font-size="8" fill="#5d5d5d">집단 시스템 능력 향상</text>

    <text x="450" y="527" text-anchor="middle" font-size="10.5" fill="#666666">평가 피드백을 바탕으로 사후 학습·지속적 진화·협업이 능력을 확장한다</text>
  </g>
</svg>
