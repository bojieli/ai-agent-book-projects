<text x="70" y="145" font-family="'Noto Sans Mono CJK KR', 'Noto Sans CJK KR', monospace" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central">        {name: &quot;PDF&quot;,  desc: &quot;PDF 문서 추출 및 분석&quot;}, ...]</text>
<line x1="410" y1="162" x2="410" y2="185" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
<text x="430" y="173" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal">업무 트리거: &quot;논문으로 PPT 만들어 줘&quot;</text>
<rect x="40" y="190" width="740" height="150" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<text x="60" y="210" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="20" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="bold">2계층: SKILL.md 핵심 절차(필요할 때 로드, 약 2K tokens)</text>
<rect x="60" y="230" width="700" height="100" rx="4" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
<text x="70" y="250" font-family="'Noto Sans Mono CJK KR', 'Noto Sans CJK KR', monospace" font-size="16" fill="#333333" text-anchor="start" dominant-baseline="central">PPTX Skill 핵심 절차:</text>
<text x="70" y="272" font-family="'Noto Sans Mono CJK KR', 'Noto Sans CJK KR', monospace" font-size="16" fill="#333333" text-anchor="start" dominant-baseline="central">1. markitdown으로 텍스트 추출 → 2. PPTX 압축 해제 후 XML 접근</text>
<text x="70" y="294" font-family="'Noto Sans Mono CJK KR', 'Noto Sans CJK KR', monospace" font-size="16" fill="#333333" text-anchor="start" dominant-baseline="central">3. slide{N}.xml 콘텐츠 수정 → 4. .pptx로 다시 패키징</text>
<text x="70" y="316" font-family="'Noto Sans Mono CJK KR', 'Noto Sans CJK KR', monospace" font-size="16" fill="#333333" text-anchor="start" dominant-baseline="central">참조: → html2pptx.md | → reference.md | → scripts/</text>
<line x1="410" y1="342" x2="410" y2="365" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
<text x="430" y="353" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal">세부 방법 필요: &quot;HTML 템플릿으로 PPT 만들어 줘&quot;</text>
