<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 900 300" width="900" height="300" style="background:#ffffff">
<defs><marker id="ah" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#333333"/></marker><marker id="ah-light" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#999999"/></marker></defs>
<rect x="30" y="66" width="380" height="210" rx="6" fill="#ffffff" stroke="#999999" stroke-width="2"/>
<text x="220" y="90" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold">Request(에이전트 프레임워크가 구성)</text>
<rect x="50" y="112" width="340" height="62" rx="6" fill="#d0d0d0" stroke="#333333" stroke-width="2"/>
<text x="70" y="132" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="bold">system</text>
<text x="70" y="154" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal">개발자가 작성한 규칙</text>
<rect x="50" y="190" width="340" height="62" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<text x="70" y="210" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="bold">user</text>
<text x="70" y="232" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal">&quot;안녕하세요. 누구세요?&quot;</text>
<line x1="410" y1="171" x2="470" y2="171" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
<text x="440.0" y="161.0" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" fill="#666666" text-anchor="middle">호출</text>
<rect x="490" y="66" width="380" height="210" rx="6" fill="#ffffff" stroke="#999999" stroke-width="2"/>
<text x="680" y="90" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold">Response(API 응답)</text>
<rect x="510" y="150" width="340" height="82" rx="4" fill="#f5f5f5" stroke="#999999" stroke-width="2"/>
<text x="530" y="174" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="bold">assistant</text>
<text x="530" y="198" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal">모델이 생성한 응답</text>
<text x="530" y="218" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" fill="#666666" text-anchor="start" dominant-baseline="central" font-weight="normal">&quot;안녕하세요! 저는 코딩 어시스턴트입니다…&quot;</text>
<text x="450" y="308" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">각 호출은 무상태입니다. 모델에 필요한 모든 정보를 요청의 messages 목록에 빠짐없이 제공해야 합니다.</text>
</svg>
