<svg xml:lang="ko" xmlns="http://www.w3.org/2000/svg" viewBox="0 40 900 430" width="900" height="430" style="background:#ffffff">
<defs><marker id="ah" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#333333"/></marker><marker id="ah-light" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#999999"/></marker></defs>
<text x="30" y="78" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="20" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="bold">첫 번째 모델 API 호출</text>
<rect x="30" y="92" width="340" height="106" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<text x="200" y="118" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold">messages: system + user</text>
<text x="200" y="148" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">tools: get_current_time,</text>
<text x="200" y="170" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">get_weather</text>
<line x1="370" y1="145" x2="480" y2="145" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
<text x="425" y="135" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" fill="#666666" text-anchor="middle">API</text>
<rect x="480" y="92" width="390" height="106" rx="6" fill="#d0d0d0" stroke="#333333" stroke-width="2"/>
<text x="675" y="112" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold">assistant: tool_calls</text>
<text x="675" y="138" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">get_current_time(timezone=&quot;America/Vancouver&quot;)</text>
<text x="675" y="158" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">get_weather(city=&quot;Vancouver&quot;, unit=&quot;celsius&quot;)</text>
<text x="675" y="180" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal">데이터 의존성 없음 → 병렬 실행 가능</text>
<line x1="675" y1="198" x2="675" y2="218" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
<rect x="480" y="220" width="390" height="50" rx="4" fill="#f5f5f5" stroke="#999999" stroke-width="2"/>
<text x="675" y="245" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal">에이전트 프레임워크가 두 도구를 병렬 실행</text>
<line x1="675" y1="270" x2="675" y2="298" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
<text x="30" y="286" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="20" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="bold">두 번째 모델 API 호출</text>
<rect x="480" y="300" width="390" height="78" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<text x="675" y="322" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold">messages: + tool 결과</text>
<text x="675" y="346" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">밴쿠버 시간 및 날씨</text>
<text x="675" y="364" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">메시지 기록에 추가한 뒤 모델을 다시 요청</text>
<line x1="480" y1="339" x2="370" y2="339" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
<text x="425" y="329" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" fill="#666666" text-anchor="middle">API</text>
<rect x="30" y="300" width="340" height="78" rx="6" fill="#d0d0d0" stroke="#333333" stroke-width="2"/>
<text x="200" y="322" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold">assistant: 최종 응답</text>
<text x="200" y="346" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">도구 호출 없음 → 루프 종료</text>
<text x="200" y="364" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">&quot;현재 시각은…, 날씨는…&quot;</text>
<text x="450" y="430" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">무상태 API에서는 매 라운드마다 전체 메시지 기록을 모델에 다시 전송해야 합니다.</text>
</svg>
