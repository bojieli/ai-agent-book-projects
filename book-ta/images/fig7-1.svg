<rect x="100" y="344" width="690" height="62" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<text class="t h" x="445" y="364">④ முடிவுகளின் பயன்பாடு</text>
<text class="t s" x="445" y="388">புள்ளியியல் முக்கியத்துவம் → தோல்விக் காரணம் → பின்னடைவு → மாதிரி &amp; Harness</text>

<path d="M100 375 L52 375 L52 147 L96 147" fill="none" stroke="#333333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text class="t n" x="52" y="262" transform="rotate(-90 52 262)">பின்னடைவுப் பணிகள் புதிய வழக்குகளாகும்</text>

<rect x="100" y="424" width="690" height="46" rx="6" fill="#f3f0e8" stroke="#333333" stroke-width="2"/>
<text class="t m" x="445" y="440" font-weight="bold">ஆதரவுக் கட்டமைப்பு</text>
<text class="t n" x="445" y="458">கவனிக்கத்தன்மை · உள் மதிப்பீட்டுக் கட்டமைப்பு (அப்லேஷன் / AB / கொடிகள்) · உருவகச் சூழல் (அத்தியாயம் 8)</text>
