<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" style="background:#ffffff">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#33434d"/></marker>
    <style>
      .t{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#26343c}
      .h{font-size:20px;font-weight:700}
      .s{font-size:15px;fill:#52636d}
      .box{fill:#f5f7f8;stroke:#33434d;stroke-width:2}
      .accent{fill:#e8f1f5;stroke:#2f617a;stroke-width:2}
      .line{fill:none;stroke:#33434d;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="500" y="30" text-anchor="middle" class="t h">நேரடி இயக்கமும் தனித்த பரிணாமமும்: வெளியிட்ட பதிப்பு இயங்கும்போது மாற்றப்படாது</text>

  <rect x="28" y="80" width="944" height="118" rx="10" fill="#fafbfb" stroke="#7d8d96" stroke-width="1.5"/>
  <text x="55" y="107" class="t h">நேரடி இயக்க வளையம்</text>
  <rect x="220" y="114" width="150" height="58" rx="7" class="box"/>
  <rect x="425" y="114" width="150" height="58" rx="7" class="box"/>
  <rect x="630" y="114" width="150" height="58" rx="7" class="box"/>
  <text x="295" y="149" text-anchor="middle" class="t s">நிலையான Agent</text>
  <text x="500" y="149" text-anchor="middle" class="t s" style="font-size:10px">நிஜப் பணிகளைக் கையாளும்</text>
  <text x="705" text-anchor="middle" class="t s" y="143.78" style="font-size:9px">பாதைகளையும் பின்னூட்டத்தையும்</text><text x="705" text-anchor="middle" class="t s" y="154.22" style="font-size:9px">பதிவு செய்யும்</text>
  <path d="M370 143 H423" class="line"/><path d="M575 143 H628" class="line"/>

  <rect x="28" y="270" width="944" height="150" rx="10" fill="#f5f8fa" stroke="#2f617a" stroke-width="1.5"/>
  <text x="55" y="298" class="t h">தனித்த பரிணாம வளையம்</text>
  <rect x="107" y="323" width="150" height="62" rx="7" class="accent"/>
  <rect x="307" y="323" width="150" height="62" rx="7" class="accent"/>
  <rect x="507" y="323" width="150" height="62" rx="7" class="accent"/>
  <rect x="707" y="323" width="170" height="62" rx="7" class="accent"/>
  <text x="182" y="349" text-anchor="middle" class="t s" style="font-size:10.5px">திரட்டலும் கண்டறிதலும்</text><text x="182" y="371" text-anchor="middle" class="t s" style="font-size:10px">பொது மூல காரணத்தைத் தேடு</text>
  <text x="382" y="349" text-anchor="middle" class="t s" style="font-size:13.5px">வேட்பாளர் மாற்றம்</text><text x="382" text-anchor="middle" class="t s" y="364.04" style="font-size:12px">அறிவு · அறிவுறுத்தல்</text><text x="382" text-anchor="middle" class="t s" y="377.96" style="font-size:12px">· நிரல் · அளபுரு</text>
  <text x="582" text-anchor="middle" class="t s" y="343.49" style="font-size:9.5px">பின்னடைவு மற்றும்</text><text x="582" text-anchor="middle" class="t s" y="354.51" style="font-size:9.5px">பாதுகாப்புச் சரிபார்ப்பு</text><text x="582" y="371" text-anchor="middle" class="t s" style="font-size:12.5px">பழைய திறனைத் தக்கவை</text>
  <text x="792" text-anchor="middle" class="t s" y="342.62" style="font-size:11px">படிப்படியான வெளியீடு,</text><text x="792" text-anchor="middle" class="t s" y="355.38" style="font-size:11px">கண்காணிப்பு, பின்வாங்கல்</text><text x="792" y="371" text-anchor="middle" class="t s" style="font-size:9px">புதிய நிலைப் பதிப்பாக உயர்த்து</text>
  <path d="M257 354 H305" class="line"/><path d="M457 354 H505" class="line"/><path d="M657 354 H705" class="line"/>

  <!-- 轨迹向下进入离线诊断，使用两层之间的独立通道。 -->
  <path d="M705 172 V232 H182 V321" class="line" stroke-dasharray="7 5"/>
  <rect x="374" y="220" width="140" height="24" rx="4" fill="#ffffff"/>
  <text x="444" text-anchor="middle" class="t s" y="228.59" style="font-size:14.5px">பதிப்பிடப்பட்ட</text><text x="444" text-anchor="middle" class="t s" y="245.41" style="font-size:14.5px">அனுபவப் பதிவேடு</text>

  <!-- 新版本从右侧外环返回稳定版 Agent，不与轨迹通道交叉或重叠。 -->
  <path d="M877 354 H986 V56 H295 V112" class="line" stroke-dasharray="7 5"/>
  <rect x="572" y="44" width="156" height="24" rx="4" fill="#ffffff"/>
  <text x="650" text-anchor="middle" class="t s" y="53.46" style="font-size:13px">சரிபார்ப்பில்</text><text x="650" text-anchor="middle" class="t s" y="68.54" style="font-size:13px">தேறிய புதிய பதிப்பு</text>

  <text x="500" y="452" text-anchor="middle" class="t s">நம்பிக்கை மூலம்: அனுமதி, தணிக்கை, சரிபார்ப்பு, பின்வாங்கல் ஆகியவை சாதாரண பரிணாம வளையத்தால் மாற்றப்படுவதில்லை</text>
</svg>
