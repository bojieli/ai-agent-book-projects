<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" style="background:#ffffff">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#666666"/>
    </marker>
  </defs>
  <g font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#2f2f2f">
    <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold">நூலின் அமைப்பு</text>

    <!-- Part I: Build an Agent -->
    <rect x="24" y="58" width="852" height="238" rx="12" fill="#fafafa" stroke="#777777" stroke-width="1.7"/>
    <rect x="54" y="46" width="224" height="27" rx="13.5" fill="#505050"/>
    <text x="166" y="65" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">பகுதி I　Agent-ஐ உருவாக்குதல்</text>

    <rect x="48" y="92" width="242" height="72" rx="8" fill="#d9d9d9" stroke="#3f3f3f" stroke-width="1.7"/>
    <text x="169" y="118" text-anchor="middle" font-size="12.5" font-weight="bold">அத்தியாயம் 1　AI Agent அறிமுகம்</text>
    <text x="169" y="143" text-anchor="middle" font-size="9.5" fill="#626262">கருத்தாக்கம் · ReAct · Harness</text>

    <line x1="290" y1="128" x2="319" y2="128" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="323" y="92" width="242" height="72" rx="8" fill="#e7e7e7" stroke="#444444" stroke-width="1.6"/>
    <text x="444" y="118" text-anchor="middle" font-size="12.5" font-weight="bold">அத்தியாயம் 2　சூழல் பொறியியல்</text>
    <text x="444" y="143" text-anchor="middle" font-size="9.5" fill="#626262">பணி நிலை · Prompt · சுருக்கம்</text>

    <line x1="565" y1="128" x2="594" y2="128" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="598" y="92" width="254" height="72" rx="8" fill="#e7e7e7" stroke="#444444" stroke-width="1.6"/>
    <text x="725" y="118" text-anchor="middle" font-size="12.5" font-weight="bold">அத்தியாயம் 3　நினைவும் அறிவுத் தளமும்</text>
    <text x="725" y="143" text-anchor="middle" font-size="9.5" fill="#626262">அமர்வுகளிடை நினைவு · RAG · அறிவு அமைப்பு</text>

    <rect x="48" y="194" width="242" height="72" rx="8" fill="#e7e7e7" stroke="#444444" stroke-width="1.6"/>
    <text x="169" y="220" text-anchor="middle" font-size="12.5" font-weight="bold">அத்தியாயம் 4　கருவிகள்</text>
    <text x="169" y="245" text-anchor="middle" font-size="9.5" fill="#626262">MCP · உணர்தல் மற்றும் செயல்பாடு · பாதுகாப்பு</text>

    <line x1="290" y1="230" x2="319" y2="230" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="323" y="194" width="242" height="72" rx="8" fill="#e7e7e7" stroke="#444444" stroke-width="1.6"/>
    <text x="444" y="220" text-anchor="middle" font-size="12.5" font-weight="bold">அத்தியாயம் 5　Coding Agent</text>
    <text x="444" y="245" text-anchor="middle" font-size="9.5" fill="#626262">குறியீடு உருவாக்கம் · பொதுத் திறன் · சுய மேம்பாடு</text>

    <line x1="565" y1="230" x2="594" y2="230" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="598" y="194" width="254" height="72" rx="8" fill="#d9d9d9" stroke="#3f3f3f" stroke-width="1.7"/>
    <text x="725" y="220" text-anchor="middle" font-size="12.5" font-weight="bold">அத்தியாயம் 6　ஊடாடல்</text>
    <text x="725" y="245" text-anchor="middle" font-size="9.5" fill="#626262">கவனிப்பு மற்றும் செயல் வெளியை விரிவாக்குதல்</text>

    <line x1="450" y1="296" x2="450" y2="332" stroke="#555555" stroke-width="1.8" marker-end="url(#arrow)"/>

    <!-- Part II: Improve Agent capabilities -->
    <rect x="24" y="335" width="852" height="211" rx="12" fill="#fafafa" stroke="#666666" stroke-width="1.8"/>
    <rect x="54" y="323" width="245" height="27" rx="13.5" fill="#424242"/>
    <text x="176.5" y="342" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">பகுதி II　Agent திறனை மேம்படுத்துதல்</text>

    <rect x="43" y="382" width="190" height="112" rx="8" fill="#e8e8e8" stroke="#444444" stroke-width="1.6"/>
    <text x="138" y="412" text-anchor="middle" font-size="9" font-weight="bold">அத்தியாயம் 7　Agent மதிப்பீடு</text>
    <text x="138" y="440" text-anchor="middle" font-size="8" fill="#626262">சூழல் · அளவீடுகள் · புள்ளியியல்</text>
    <text x="138" y="466" text-anchor="middle" font-size="8" fill="#626262">அளவிடத்தக்க பின்னூட்டம்</text>

    <line x1="233" y1="438" x2="246" y2="438" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="250" y="382" width="190" height="112" rx="8" fill="#e2e2e2" stroke="#444444" stroke-width="1.6"/>
    <text x="345" y="412" text-anchor="middle" font-size="9" font-weight="bold">அத்தியாயம் 8　மாதிரி பிந்தைய பயிற்சி</text>
    <text x="345" y="440" text-anchor="middle" font-size="8" fill="#626262">SFT · RL · வெகுமதி வடிவமைப்பு</text>
    <text x="345" y="466" text-anchor="middle" font-size="8" fill="#626262">மாதிரியின் அளபுருத் திறன்</text>

    <line x1="440" y1="438" x2="453" y2="438" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="457" y="382" width="190" height="112" rx="8" fill="#d9d9d9" stroke="#3f3f3f" stroke-width="1.7"/>
    <text x="552" y="412" text-anchor="middle" font-size="9" font-weight="bold">அத்தியாயம் 9　தொடர்ச்சியான பரிணாமம்</text>
    <text x="552" y="440" text-anchor="middle" font-size="8" fill="#626262">அனுபவம் · புதுப்பிப்பு · வெளியீடு/மீளமைப்பு</text>
    <text x="552" y="466" text-anchor="middle" font-size="8" fill="#626262">தனி அமைப்பின் திறன்</text>

    <line x1="647" y1="438" x2="660" y2="438" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="664" y="382" width="193" height="112" rx="8" fill="#cecece" stroke="#333333" stroke-width="1.8"/>
    <text x="760.5" y="412" text-anchor="middle" font-size="9" font-weight="bold">அத்தியாயம் 10　பல-Agent ஒத்துழைப்பு</text>
    <text x="760.5" y="440" text-anchor="middle" font-size="8" fill="#5d5d5d">பணிப்பகிர்வு · தொடர்பு · ஒருங்கிணைப்பு</text>
    <text x="760.5" y="466" text-anchor="middle" font-size="8" fill="#5d5d5d">கூட்டு அமைப்பின் திறன்</text>

    <text x="450" y="527" text-anchor="middle" font-size="10.5" fill="#666666">மதிப்பீட்டுப் பின்னூட்டம் பிந்தைய பயிற்சி, பரிணாமம், ஒத்துழைப்பை வழிநடத்துகிறது</text>
  </g>
</svg>
