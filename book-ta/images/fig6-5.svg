<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540">
  <title>படம் 6-5: ஒத்திசைவு இடைமுக இணக்கமும் மாதிரியின் நேரடி ஒத்திசைவற்ற ஆதரவும்</title>
  <desc>முந்தைய இணக்க வழியில், ஒத்திசைவு இடைமுகமுள்ள மாதிரி ஒத்திசைவற்ற பணிகளில் பங்கேற்கும்படி இயக்கச்சூழல் நிகழ்வுகளின் நுழைவு வரிசையை ஒழுங்குபடுத்துகிறது. மற்றொரு வழி, மாதிரியே இந்தத் தொடர்பாடல் தாளத்தை நேரடியாகப் புரிந்துகொள்வது: கருவி இயங்கும்போது வேறு வேலையைத் தொடர்வதும், பயனர் இடையில் தேவைகளைச் சேர்க்கும்போது அடுத்த வேலையை மாற்றுவதும். GPT-6 Astra ஏற்கெனவே ஒத்திசைவற்ற கருவி அழைப்பையும் (Async tool calling), பதிலளிக்கும் போதே வழிகாட்டுதலையும் (Mid-turn steering) ஆதரிக்கிறது; இது அந்த மாற்றத்தைக் காட்டுகிறது (படம் 6-5).</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#555" /></marker>
    <style>
      text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#333}
      .title{font-size:20px;font-weight:700}
      .label{font-size:17px;font-weight:600}
      .small{font-size:15px}
      .box{fill:#f4f4f4;stroke:#555;stroke-width:1.5}
      .arrow{fill:none;stroke:#555;stroke-width:1.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="880" height="540" fill="#fff" />
  <rect x="20" y="20" width="840" height="145" rx="8" fill="#fff" stroke="#777" stroke-dasharray="7 4" />
  <text x="40" y="53" class="title">இணக்கம்: இயக்கச்சூழல் ஒத்திசைவற்ற பணியை ஒழுங்குபடுத்தும்</text>
  <rect x="40" y="75" width="230" height="60" rx="5" class="box" />
  <text x="155" y="100" text-anchor="middle" class="label" style="font-size:16.84px">பணி பின்னணியில் இயங்கும்</text>
  <text x="155" y="122" text-anchor="middle" class="small">முடியாத நிலையைப் பதிவு செய்</text>
  <path d="M270 105 H313" class="arrow" />
  <rect x="320" y="75" width="240" height="60" rx="5" class="box" />
  <text x="440" y="100" text-anchor="middle" class="label">புதிய நிகழ்வுகளைப் பெறு</text>
  <text x="440" y="122" text-anchor="middle" class="small" style="font-size:14.03px">வரிசை, குறுக்கீடு, இணை இயக்கம்</text>
  <path d="M560 105 H603" class="arrow" />
  <rect x="610" y="75" width="230" height="60" rx="5" class="box" />
  <text x="725" y="100" text-anchor="middle" class="label">மாதிரி பணியைத் தொடரும்</text>
  <text x="725" y="122" text-anchor="middle" class="small" style="font-size:13.05px">உள்ளீடுகள் ஒத்திசைவான சுற்றுகளில்</text>

  <rect x="20" y="185" width="840" height="250" rx="8" fill="#fff" stroke="#444" stroke-width="2" />
  <text x="40" y="218" class="title">நேரடி ஒத்திசைவற்ற ஆதரவு: காத்திருப்பையும் இடைப்பட்ட மாற்றத்தையும் புரிதல்</text>
  <rect x="40" y="240" width="230" height="65" rx="5" class="box" />
  <text x="155" y="267" text-anchor="middle" class="label" style="font-size:16.54px">நீண்ட வினவலைத் தொடங்கு</text>
  <text x="155" y="290" text-anchor="middle" class="small">கூட்ட இடங்களைத் தேடு</text>
  <path d="M270 272 H313" class="arrow" />
  <rect x="320" y="240" width="240" height="65" rx="5" class="box" />
  <text x="440" y="267" text-anchor="middle" class="label" style="font-size:14.85px">காத்திருக்கும்போதே பணியாற்று</text>
  <text x="440" y="290" text-anchor="middle" class="small" style="font-size:13.86px">நிரலும் தயாரிப்புப் பட்டியலும் அமை</text>
  <path d="M560 272 H603" class="arrow" />
  <rect x="610" y="240" width="230" height="65" rx="5" class="box" />
  <text x="725" y="267" text-anchor="middle" class="label">முடிவுகள் வந்ததும் தீர்மானி</text>
  <text x="725" y="290" text-anchor="middle" class="small">உண்மைத் தகவலுடன் ஒப்பிடு</text>

  <rect x="40" y="340" width="230" height="65" rx="5" class="box" />
  <text x="155" y="367" text-anchor="middle" class="label" style="font-size:15.34px">பயனர் தேவைகளைச் சேர்ப்பார்</text>
  <text x="155" y="390" text-anchor="middle" class="small">பட்ஜெட், எண்ணிக்கை மாற்றம்</text>
  <path d="M270 372 H313" class="arrow" />
  <rect x="320" y="340" width="240" height="65" rx="5" class="box" />
  <text x="440" y="367" text-anchor="middle" class="label">முடிந்த வேலையைப் பாதுகா</text>
  <text x="440" y="390" text-anchor="middle" class="small" style="font-size:14.43px">புதிய தேவைகளைப் பணியில் சேர்</text>
  <path d="M560 372 H603" class="arrow" />
  <rect x="610" y="340" width="230" height="65" rx="5" class="box" />
  <text x="725" y="367" text-anchor="middle" class="label">அடுத்த செயல்களை மாற்று</text>
  <text x="725" y="390" text-anchor="middle" class="small">தகவல், புதுப்பிப்புகளை இணை</text>

  <rect x="20" y="455" width="840" height="65" rx="6" fill="#e9e9e9" />
  <text x="440" y="482" text-anchor="middle" class="label">மாதிரி மாற்றத்தைப் புரிந்து திட்டமிடும்; இயக்கச்சூழல் கருவி, நிலை, நிகழ்வு மூலங்களை நிர்வகிக்கும்</text>
  <text x="440" y="506" text-anchor="middle" class="small">செய்திகளைப் பெறுவதுடன், பணியைச் சரியாகத் தொடரவும் செயல்களைக் கட்டுப்படுத்தவும் வேண்டும்.</text>
</svg>
