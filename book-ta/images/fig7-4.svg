<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 274" width="880" height="274" style="background:#ffffff">
<defs>
<marker id="ax" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 12 4, 0 8" fill="#333333"/></marker>
<marker id="ah-s" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 10 3.5, 0 7" fill="#666666"/></marker>
</defs>
<style>
.t{font-family:Arial,'Helvetica Neue',Helvetica,'PingFang SC','Microsoft YaHei',sans-serif;fill:#333333;text-anchor:middle;dominant-baseline:central}
.h{font-size:13px;font-weight:bold}
.m{font-size:10px;fill:#666666}
.n{font-size:10px;fill:#333333}
.a{font-size:11px;fill:#333333}
</style>

<line x1="40" y1="26" x2="846" y2="26" stroke="#333333" stroke-width="2" marker-end="url(#ax)"/>
<text class="t a" x="130" y="12">பணியின் இயந்திரச் சரிபார்ப்புத் தன்மை: உயர்</text>
<text class="t a" x="790" y="12">தாழ்</text>

<rect x="18" y="52" width="190" height="112" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<text class="t h" x="113" y="76">நிர்ணயவாதம்</text>
<text class="t m" x="113" y="100">இறுதி நிலை ஒற்றை, வினவக்கூடியது</text>
<text class="t m" x="113" y="120">தேர்ச்சி / தோல்வி</text>
<text class="t n" x="113" y="146">SWE-bench சோதனை இயக்கும்</text>
<line x1="212" y1="108" x2="232" y2="108" stroke="#666666" stroke-width="1.5" marker-end="url(#ah-s)"/>

<rect x="236" y="52" width="190" height="112" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<text class="t h" x="331" y="76">சோதனைப் பட்டியல்</text>
<text class="t m" x="331" y="100">பல நிர்ணயவாதச் சோதனைகள்</text>
<text class="t m" x="331" y="120">அறிவிக்கப்பட்ட அடிப்படையில் தொகுப்பு</text>
<text class="t n" x="331" y="146">τ²-bench நான்கு அடுக்கு</text>
<line x1="430" y1="108" x2="450" y2="108" stroke="#666666" stroke-width="1.5" marker-end="url(#ah-s)"/>

<rect x="454" y="52" width="190" height="112" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<text class="t h" x="549" y="76">Rubric + LLM</text>
<text class="t m" x="549" y="100">பரிமாணம் உண்டு, குறியீடு தீர்க்காது</text>
<text class="t m" x="549" y="120">பரிமாணவாரி மதிப்பெண் + காரணம்</text>
<text class="t n" x="549" y="146">சேவைத் தரம், அறிக்கை எழுதல்</text>
<line x1="648" y1="108" x2="668" y2="108" stroke="#666666" stroke-width="1.5" marker-end="url(#ah-s)"/>

<rect x="672" y="52" width="190" height="112" rx="6" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<text class="t h" x="767" y="76">இணை ஒப்பீடு</text>
<text class="t m" x="767" y="100">பரிமாணத்தையே எழுதுவது கடினம்</text>
<text class="t m" x="767" y="120">A, B இடையே மட்டுமே தீர்ப்பு</text>
<text class="t n" x="767" y="146">Chatbot Arena</text>

<rect x="18" y="192" width="408" height="66" rx="6" fill="#f3f0e8" stroke="#333333" stroke-width="2"/>
<text class="t h" x="222" y="212">நிர்ணயவாதச் சரிபார்ப்பு</text>
<text class="t m" x="222" y="234">முழு மறுஉருவாக்கம், CI க்கு ஏற்றது, மலிவு</text>
<text class="t m" x="222" y="250">விலை: சரி/தவறு மட்டுமே, இடம் சொல்லாது</text>

<rect x="454" y="192" width="408" height="66" rx="6" fill="#f3f0e8" stroke="#333333" stroke-width="2"/>
<text class="t h" x="658" y="212">மாதிரித் தீர்ப்பு</text>
<text class="t m" x="658" y="234">நோயறி பரிமாணம் தரும், உறுதிமொழியாகாததையும் உள்ளடக்கும்</text>
<text class="t m" x="658" y="250">விலை: தீர்ப்புச் சாய்வும் ஏற்ற இறக்கமும், அதிகச் செலவு</text>
</svg>
