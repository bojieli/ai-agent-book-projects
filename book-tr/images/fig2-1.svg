<text x="65" y="400" font-family="'Courier New', Courier, monospace" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central">&lt;think&gt;Kullanıcı havayı soruyor. Araç sonucu zaten elimde,</text>
