<text x="310.0" y="250.75" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.0" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">Yalnızca en iyi K sunucunun araçları arasında eşleştir → en iyi N araç</text>
