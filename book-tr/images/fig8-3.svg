<text x="310.0" y="328.15000000000003" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.0" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">Aday kapsamını belirgin şekilde daraltır, seçim maliyetini azaltır</text>
