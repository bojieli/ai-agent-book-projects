<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540">
  <title>Şekil 6-5: Senkron arayüz uyumluluğu ve modelin yerleşik asenkron yetenekleri</title>
  <desc>Önceki uyumluluk yaklaşımında çalışma zamanı, gelen olayların sırasını düzenleyerek senkron arayüzlü modelin asenkron görevlere katılmasını sağlar. Diğer yaklaşımda model bu etkileşim ritmini doğrudan anlar: araç çalışırken başka işler yapabilir, kullanıcı yeni gereksinimler eklediğinde sonraki işi değiştirebilir. GPT-6 Astra'nın desteklediği asenkron araç çağırma (Async tool calling) ve tur içi yönlendirme (Mid-turn steering), bu değişimi gösterir (Şekil 6-5).</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#555" /></marker>
    <style>
      text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#333}
      .title{font-size:20px;font-weight:700}
      .label{font-size:17px;font-weight:600}
      .small{font-size:15px}
      .box{fill:#f4f4f4;stroke:#555;stroke-width:1.5}
      .arrow{fill:none;stroke:#555;stroke-width:1.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="880" height="540" fill="#fff" />
  <rect x="20" y="20" width="840" height="145" rx="8" fill="#fff" stroke="#777" stroke-dasharray="7 4" />
  <text x="40" y="53" class="title">Uyumluluk: çalışma zamanı asenkron işi düzenler</text>
  <rect x="40" y="75" width="230" height="60" rx="5" class="box" />
  <text x="155" y="100" text-anchor="middle" class="label">Görev arka planda çalışır</text>
  <text x="155" y="122" text-anchor="middle" class="small">Tamamlanmadığı açıkça kayıtlı</text>
  <path d="M270 105 H313" class="arrow" />
  <rect x="320" y="75" width="240" height="60" rx="5" class="box" />
  <text x="440" y="100" text-anchor="middle" class="label">Yeni olayları al</text>
  <text x="440" y="122" text-anchor="middle" class="small" style="font-size:13.69px">Kuyruk, kesinti veya paralel işleme</text>
  <path d="M560 105 H603" class="arrow" />
  <rect x="610" y="75" width="230" height="60" rx="5" class="box" />
  <text x="725" y="100" text-anchor="middle" class="label">Model göreve devam eder</text>
  <text x="725" y="122" text-anchor="middle" class="small" style="font-size:14.92px">Girdiler hâlâ senkron turlardadır</text>

  <rect x="20" y="185" width="840" height="250" rx="8" fill="#fff" stroke="#444" stroke-width="2" />
  <text x="40" y="218" class="title">Yerleşik asenkronluk: beklemeyi ve görev içi değişimi anlamak</text>
  <rect x="40" y="240" width="230" height="65" rx="5" class="box" />
  <text x="155" y="267" text-anchor="middle" class="label">Uzun sorguyu başlat</text>
  <text x="155" y="290" text-anchor="middle" class="small">Toplantı mekânlarını sorgula</text>
  <path d="M270 272 H313" class="arrow" />
  <rect x="320" y="240" width="240" height="65" rx="5" class="box" />
  <text x="440" y="267" text-anchor="middle" class="label" style="font-size:15.81px">Beklerken çalışmaya devam</text>
  <text x="440" y="290" text-anchor="middle" class="small" style="font-size:13.34px">Gündemi ve hazırlık listesini oluştur</text>
  <path d="M560 272 H603" class="arrow" />
  <rect x="610" y="240" width="230" height="65" rx="5" class="box" />
  <text x="725" y="267" text-anchor="middle" class="label">Sonuç gelince karar ver</text>
  <text x="725" y="290" text-anchor="middle" class="small" style="font-size:13.06px">Mekânları gerçek verilerle karşılaştır</text>

  <rect x="40" y="340" width="230" height="65" rx="5" class="box" />
  <text x="155" y="367" text-anchor="middle" class="label" style="font-size:16.92px">Kullanıcı yeni şartlar ekler</text>
  <text x="155" y="390" text-anchor="middle" class="small">Bütçe veya katılımcı değişir</text>
  <path d="M270 372 H313" class="arrow" />
  <rect x="320" y="340" width="240" height="65" rx="5" class="box" />
  <text x="440" y="367" text-anchor="middle" class="label">Tamamlanan işi koru</text>
  <text x="440" y="390" text-anchor="middle" class="small">Yeni şartları göreve kat</text>
  <path d="M560 372 H603" class="arrow" />
  <rect x="610" y="340" width="230" height="65" rx="5" class="box" />
  <text x="725" y="367" text-anchor="middle" class="label">Sonraki eylemleri değiştir</text>
  <text x="725" y="390" text-anchor="middle" class="small" style="font-size:13.26px">Veri ve güncellemeleri birlikte kullan</text>

  <rect x="20" y="455" width="840" height="65" rx="6" fill="#e9e9e9" />
  <text x="440" y="482" text-anchor="middle" class="label">Model değişimi anlar, planı yeniler; çalışma zamanı araçları, durumu ve olay kaynaklarını yönetir.</text>
  <text x="440" y="506" text-anchor="middle" class="small">Mesaj almak, görevi doğru sürdürmeyi ve gerçek eylemleri kontrol etmeyi de gerektirir.</text>
</svg>
