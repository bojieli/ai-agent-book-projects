<text x="645" y="549" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" fill="#ffffff" text-anchor="middle" dominant-baseline="central" font-weight="bold">Örnekten uyarlama: en iyi uygulamaları miras alır</text>
<text x="645" y="571" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#ffffff" text-anchor="middle" dominant-baseline="central" font-weight="normal">Standart mesaj biçimi · Standart araç tasarımı · Modern API</text>
