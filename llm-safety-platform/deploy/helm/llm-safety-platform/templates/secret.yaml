apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llm-safety.name" . }}-secrets
type: Opaque
stringData:
  databaseUrl: {{ .Values.secrets.databaseUrl | quote }}
  redisUrl: {{ .Values.secrets.redisUrl | quote }}
  masterKey: {{ .Values.secrets.masterKey | quote }}
  adminToken: {{ .Values.secrets.adminToken | quote }}
