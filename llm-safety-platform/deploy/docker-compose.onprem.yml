# On-prem profile — point moderation at private GPU / vLLM endpoint.
# Usage:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.onprem.yml up -d
#
# Set MODERATION_UPSTREAM_* in deploy/.env.moderation or the environment.
# Optional: SAFETY_CLASSIFIER_URL may override to a different private classify service.

services:
  moderation:
    environment:
      MODERATION_MOCK: "0"
      MODERATION_FUSE_RULES: "1"
      MODERATION_UPSTREAM_URL: ${MODERATION_UPSTREAM_URL:-http://host.docker.internal:8000/v1}
      MODERATION_UPSTREAM_KEY: ${MODERATION_UPSTREAM_KEY:-}
      MODERATION_MODEL: ${MODERATION_MODEL:-qwen2.5-7b-instruct}
      # Simulate on-prem when no GPU: set MODERATION_ONPREM_MOCK=1
      MODERATION_ONPREM_MOCK: ${MODERATION_ONPREM_MOCK:-0}

  gateway:
    environment:
      SAFETY_SCANNER_MODE: remote
      SAFETY_CLASSIFIER_URL: ${SAFETY_CLASSIFIER_URL:-http://moderation:8091/v1/classify}
      SAFETY_REMOTE_FAIL_CLOSED: "1"
      SAFETY_KMS_PROVIDER: ${SAFETY_KMS_PROVIDER:-env}
      SAFETY_SIEM_SINK: ${SAFETY_SIEM_SINK:-file}
      SAFETY_SIEM_FILE_PATH: /data/siem_events.jsonl
      SAFETY_OIDC_DISABLED: ${SAFETY_OIDC_DISABLED:-1}
      SAFETY_OIDC_JWKS_URL: ${SAFETY_OIDC_JWKS_URL:-}
      SAFETY_OIDC_ISSUER: ${SAFETY_OIDC_ISSUER:-}
      OIDC_REQUIRED: ${OIDC_REQUIRED:-0}
      SAFETY_SESSION_STORE: redis
      SAFETY_DUAL_LLM: ${SAFETY_DUAL_LLM:-0}
