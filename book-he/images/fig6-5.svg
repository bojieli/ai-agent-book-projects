<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540">
  <title>איור 6-5: תאימות לממשק סינכרוני ואסינכרוניות מובנית במודל</title>
  <desc>בגישת התאימות הקודמת, סביבת הריצה מסדרת את כניסת האירועים כדי שמודל בעל ממשק סינכרוני ישתתף במשימות אסינכרוניות. דרך אחרת היא שהמודל יבין את קצב האינטראקציה באופן מובנה: יוכל לעסוק בעבודה אחרת כשהכלי פועל, ולהתאים את ההמשך כשהמשתמש מוסיף דרישות. GPT-6 Astra כבר תומך בקריאות אסינכרוניות לכלים (Async tool calling) ובהכוונה באמצע תור (Mid-turn steering), ומדגים את השינוי הזה (איור 6-5).</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#555" /></marker>
    <style>
      text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#333}
      .title{font-size:20px;font-weight:700}
      .label{font-size:17px;font-weight:600}
      .small{font-size:15px}
      .box{fill:#f4f4f4;stroke:#555;stroke-width:1.5}
      .arrow{fill:none;stroke:#555;stroke-width:1.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="880" height="540" fill="#fff" />
  <rect x="20" y="20" width="840" height="145" rx="8" fill="#fff" stroke="#777" stroke-dasharray="7 4" />
  <text x="840" y="53" class="title" direction="rtl" unicode-bidi="plaintext">תאימות: סביבת הריצה מתזמנת עבודה אסינכרונית</text>
  <rect x="40" y="75" width="230" height="60" rx="5" class="box" />
  <text x="155" y="100" text-anchor="middle" class="label" direction="rtl" unicode-bidi="plaintext">המשימה פועלת ברקע</text>
  <text x="155" y="122" text-anchor="middle" class="small" direction="rtl" unicode-bidi="plaintext">סימון מפורש: טרם הושלם</text>
  <path d="M270 105 H313" class="arrow" />
  <rect x="320" y="75" width="240" height="60" rx="5" class="box" />
  <text x="440" y="100" text-anchor="middle" class="label" direction="rtl" unicode-bidi="plaintext">קבלת אירועים חדשים</text>
  <text x="440" y="122" text-anchor="middle" class="small" direction="rtl" unicode-bidi="plaintext">תור, הפרעה או עיבוד מקבילי</text>
  <path d="M560 105 H603" class="arrow" />
  <rect x="610" y="75" width="230" height="60" rx="5" class="box" />
  <text x="725" y="100" text-anchor="middle" class="label" direction="rtl" unicode-bidi="plaintext">המודל ממשיך במשימה</text>
  <text x="725" y="122" text-anchor="middle" class="small" direction="rtl" unicode-bidi="plaintext">קלט בתורות סינכרוניים</text>

  <rect x="20" y="185" width="840" height="250" rx="8" fill="#fff" stroke="#444" stroke-width="2" />
  <text x="840" y="218" class="title" direction="rtl" unicode-bidi="plaintext">אסינכרוניות מובנית: להבין המתנה ושינויים במהלך המשימה</text>
  <rect x="40" y="240" width="230" height="65" rx="5" class="box" />
  <text x="155" y="267" text-anchor="middle" class="label" direction="rtl" unicode-bidi="plaintext">התחלת שאילתה ממושכת</text>
  <text x="155" y="290" text-anchor="middle" class="small" direction="rtl" unicode-bidi="plaintext">חיפוש מקום לפגישה</text>
  <path d="M270 272 H313" class="arrow" />
  <rect x="320" y="240" width="240" height="65" rx="5" class="box" />
  <text x="440" y="267" text-anchor="middle" class="label" direction="rtl" unicode-bidi="plaintext">עבודה בזמן ההמתנה</text>
  <text x="440" y="290" text-anchor="middle" class="small" direction="rtl" unicode-bidi="plaintext">הכנת סדר יום ורשימת הכנות</text>
  <path d="M560 272 H603" class="arrow" />
  <rect x="610" y="240" width="230" height="65" rx="5" class="box" />
  <text x="725" y="267" text-anchor="middle" class="label" direction="rtl" unicode-bidi="plaintext">החלטה כשהתוצאות מגיעות</text>
  <text x="725" y="290" text-anchor="middle" class="small" direction="rtl" unicode-bidi="plaintext">השוואת מקומות לפי מידע אמיתי</text>

  <rect x="40" y="340" width="230" height="65" rx="5" class="box" />
  <text x="155" y="367" text-anchor="middle" class="label" direction="rtl" unicode-bidi="plaintext">המשתמש מוסיף דרישות</text>
  <text x="155" y="390" text-anchor="middle" class="small" direction="rtl" unicode-bidi="plaintext">שינוי תקציב או מספר משתתפים</text>
  <path d="M270 372 H313" class="arrow" />
  <rect x="320" y="340" width="240" height="65" rx="5" class="box" />
  <text x="440" y="367" text-anchor="middle" class="label" direction="rtl" unicode-bidi="plaintext">שמירת העבודה שהושלמה</text>
  <text x="440" y="390" text-anchor="middle" class="small" direction="rtl" unicode-bidi="plaintext">שילוב דרישות חדשות במשימה</text>
  <path d="M560 372 H603" class="arrow" />
  <rect x="610" y="340" width="230" height="65" rx="5" class="box" />
  <text x="725" y="367" text-anchor="middle" class="label" direction="rtl" unicode-bidi="plaintext">התאמת הפעולות הבאות</text>
  <text x="725" y="390" text-anchor="middle" class="small" direction="rtl" unicode-bidi="plaintext">שילוב המידע וכל העדכונים</text>

  <rect x="20" y="455" width="840" height="65" rx="6" fill="#e9e9e9" />
  <text x="440" y="482" text-anchor="middle" class="label" direction="rtl" unicode-bidi="plaintext">המודל מבין שינוי ומעדכן תוכנית; סביבת הריצה מנהלת כלים, מצב ומקורות אירועים</text>
  <text x="440" y="506" text-anchor="middle" class="small" direction="rtl" unicode-bidi="plaintext">קבלת הודעות מחייבת גם חידוש משימות ושליטה נכונה בפעולות.</text>
</svg>
