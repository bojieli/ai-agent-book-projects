<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540">
  <title>Figura 6-5: Compatibilidade síncrona e assincronia nativa do modelo</title>
  <desc>Na abordagem anterior, o runtime ordena a entrada de eventos para que um modelo com interface síncrona participe de tarefas assíncronas. Outra abordagem permite que o próprio modelo compreenda esse ritmo: trabalhar em outras partes enquanto uma ferramenta executa e ajustar o trabalho seguinte quando o usuário acrescenta requisitos. O GPT-6 Astra já oferece chamadas assíncronas a ferramentas (Async tool calling) e orientação durante o turno (Mid-turn steering), exemplificando essa mudança (Figura 6-5).</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#555" /></marker>
    <style>
      text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#333}
      .title{font-size:20px;font-weight:700}
      .label{font-size:17px;font-weight:600}
      .small{font-size:15px}
      .box{fill:#f4f4f4;stroke:#555;stroke-width:1.5}
      .arrow{fill:none;stroke:#555;stroke-width:1.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="880" height="540" fill="#fff" />
  <rect x="20" y="20" width="840" height="145" rx="8" fill="#fff" stroke="#777" stroke-dasharray="7 4" />
  <text x="40" y="53" class="title">Compatibilidade: o runtime organiza o trabalho assíncrono</text>
  <rect x="40" y="75" width="230" height="60" rx="5" class="box" />
  <text x="155" y="100" text-anchor="middle" class="label">Tarefa em segundo plano</text>
  <text x="155" y="122" text-anchor="middle" class="small">Estado pendente explícito</text>
  <path d="M270 105 H313" class="arrow" />
  <rect x="320" y="75" width="240" height="60" rx="5" class="box" />
  <text x="440" y="100" text-anchor="middle" class="label">Receber novos eventos</text>
  <text x="440" y="122" text-anchor="middle" class="small" style="font-size:13.25px">Enfileirar, interromper ou paralelizar</text>
  <path d="M560 105 H603" class="arrow" />
  <rect x="610" y="75" width="230" height="60" rx="5" class="box" />
  <text x="725" y="100" text-anchor="middle" class="label">O modelo continua</text>
  <text x="725" y="122" text-anchor="middle" class="small">Entradas em turnos síncronos</text>

  <rect x="20" y="185" width="840" height="250" rx="8" fill="#fff" stroke="#444" stroke-width="2" />
  <text x="40" y="218" class="title">Assincronia nativa: compreender esperas e mudanças durante a tarefa</text>
  <rect x="40" y="240" width="230" height="65" rx="5" class="box" />
  <text x="155" y="267" text-anchor="middle" class="label" style="font-size:16.94px">Iniciar consulta demorada</text>
  <text x="155" y="290" text-anchor="middle" class="small" style="font-size:14.93px">Buscar locais para uma reunião</text>
  <path d="M270 272 H313" class="arrow" />
  <rect x="320" y="240" width="240" height="65" rx="5" class="box" />
  <text x="440" y="267" text-anchor="middle" class="label" style="font-size:16.43px">Trabalhar enquanto espera</text>
  <text x="440" y="290" text-anchor="middle" class="small" style="font-size:14.70px">Preparar pauta e lista de tarefas</text>
  <path d="M560 272 H603" class="arrow" />
  <rect x="610" y="240" width="230" height="65" rx="5" class="box" />
  <text x="725" y="267" text-anchor="middle" class="label" style="font-size:16.79px">Decidir com os resultados</text>
  <text x="725" y="290" text-anchor="middle" class="small" style="font-size:14.10px">Comparar locais com dados reais</text>

  <rect x="40" y="340" width="230" height="65" rx="5" class="box" />
  <text x="155" y="367" text-anchor="middle" class="label" style="font-size:14.70px">Usuário acrescenta requisitos</text>
  <text x="155" y="390" text-anchor="middle" class="small" style="font-size:13.25px">Mudanças de orçamento ou público</text>
  <path d="M270 372 H313" class="arrow" />
  <rect x="320" y="340" width="240" height="65" rx="5" class="box" />
  <text x="440" y="367" text-anchor="middle" class="label" style="font-size:14.26px">Preservar o trabalho concluído</text>
  <text x="440" y="390" text-anchor="middle" class="small">Incorporar novos requisitos</text>
  <path d="M560 372 H603" class="arrow" />
  <rect x="610" y="340" width="230" height="65" rx="5" class="box" />
  <text x="725" y="367" text-anchor="middle" class="label">Ajustar ações seguintes</text>
  <text x="725" y="390" text-anchor="middle" class="small">Integrar dados e atualizações</text>

  <rect x="20" y="455" width="840" height="65" rx="6" fill="#e9e9e9" />
  <text x="440" y="482" text-anchor="middle" class="label">Modelo: entender mudanças e rever planos. Runtime: ferramentas, estado e fontes de eventos.</text>
  <text x="440" y="506" text-anchor="middle" class="small">Receber mensagens também exige retomar tarefas e controlar ações corretamente.</text>
</svg>
