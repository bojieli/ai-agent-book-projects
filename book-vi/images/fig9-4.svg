<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" style="background:#ffffff">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#33434d"/></marker>
    <style>
      .t{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#26343c}
      .h{font-size:19px;font-weight:700}
      .s{font-size:15px;fill:#52636d}
      .box{fill:#f5f7f8;stroke:#33434d;stroke-width:2}
      .accent{fill:#e8f1f5;stroke:#2f617a;stroke-width:2}
      .line{fill:none;stroke:#33434d;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="500" y="30" text-anchor="middle" class="t h">Biến kinh nghiệm thành tri thức: quỹ đạo là bằng chứng, tài liệu mới là đơn vị tái dùng</text>

  <rect x="22" y="78" width="168" height="96" rx="8" class="box"/>
  <text x="106" y="111" text-anchor="middle" class="t h">Quỹ đạo gốc</text>
  <text x="106" y="139" text-anchor="middle" class="t s" style="font-size:10.5px">Hành động, kết quả, môi trường</text>
  <text x="106" y="160" text-anchor="middle" class="t s">Bằng chứng bất biến</text>

  <rect x="215" y="78" width="168" height="96" rx="8" class="box"/>
  <text x="299" y="111" text-anchor="middle" class="t h">Đánh giá đơn lẻ</text>
  <text x="299" y="139" text-anchor="middle" class="t s" style="font-size:12.5px">Thành công, thất bại, nhãn</text>
  <text x="299" y="160" text-anchor="middle" class="t s">Giữ vị trí bằng chứng</text>

  <rect x="408" y="63" width="184" height="126" rx="8" class="accent"/>
  <text x="500" y="97" text-anchor="middle" class="t h" style="font-size:13.5px">So sánh giữa các quỹ đạo</text>
  <text x="500" y="128" text-anchor="middle" class="t s">Gộp các tác vụ cùng loại</text>
  <text x="500" y="151" text-anchor="middle" class="t s" style="font-size:11.5px">Đối chiếu thành công với thất bại</text>
  <text x="500" y="174" text-anchor="middle" class="t s" style="font-size:12px">Rút ra điểm chung và ranh giới</text>

  <rect x="617" y="63" width="184" height="126" rx="8" class="accent"/>
  <text x="709" y="97" text-anchor="middle" class="t h">Tài liệu Markdown</text>
  <text x="709" y="128" text-anchor="middle" class="t s" style="font-size:12px">Bối cảnh áp dụng và chiến lược</text>
  <text x="709" y="151" text-anchor="middle" class="t s" style="font-size:12.5px">Ngoại lệ, vùng cấm và nguồn</text>
  <text x="709" y="174" text-anchor="middle" class="t s" style="font-size:10.5px">Phiên bản và thời điểm kiểm chứng</text>

  <rect x="826" y="78" width="152" height="96" rx="8" class="box"/>
  <text x="902" y="111" text-anchor="middle" class="t h" style="font-size:14.5px">Truy hồi và áp dụng</text>
  <text x="902" y="139" text-anchor="middle" class="t s" style="font-size:10px">Nạp theo nhu cầu cho tác vụ mới</text>
  <text x="902" y="160" text-anchor="middle" class="t s" style="font-size:13.5px">Tiếp tục sinh phản hồi</text>

  <path d="M190 126 H213" class="line"/>
  <path d="M383 126 H406" class="line"/>
  <path d="M592 126 H615" class="line"/>
  <path d="M801 126 H824" class="line"/>

  <path d="M902 174 V244 H500 V191" class="line" stroke-dasharray="7 5"/>
  <text x="700" y="270" text-anchor="middle" class="t s">Bằng chứng mới sửa đổi, thu hẹp hoặc loại bỏ tri thức cũ</text>

  <rect x="215" y="302" width="586" height="48" rx="8" fill="#fafbfb" stroke="#9aa8af"/>
  <text x="508" y="332" text-anchor="middle" class="t s" style="font-size:10.5px">Dùng chung hạ tầng trích xuất và truy hồi với chương 3; chương này thêm đánh giá quỹ đạo và vòng cải thiện hành vi</text>
</svg>
