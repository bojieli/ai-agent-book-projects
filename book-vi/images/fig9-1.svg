<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" style="background:#ffffff">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#33434d"/>
    </marker>
    <style>
      .t{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#26343c}
      .h{font-size:20px;font-weight:700}
      .s{font-size:15px;fill:#52636d}
      .box{fill:#f5f7f8;stroke:#33434d;stroke-width:2}
      .accent{fill:#e8f1f5;stroke:#2f617a;stroke-width:2}
      .line{fill:none;stroke:#33434d;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>

  <text x="500" y="28" text-anchor="middle" class="t h">Tiến hóa liên tục: từ kinh nghiệm vận hành đến phiên bản Agent mới</text>

  <rect x="25" y="72" width="150" height="90" rx="8" class="box"/>
  <text x="100" y="105" text-anchor="middle" class="t h" style="font-size:19.5px">Thực thi tác vụ</text>
  <text x="100" text-anchor="middle" class="t s" y="127.33" style="font-size:11.5px">Tương tác với người dùng,</text><text x="100" text-anchor="middle" class="t s" y="140.67" style="font-size:11.5px">môi trường và công cụ</text>

  <rect x="205" y="72" width="150" height="90" rx="8" class="box"/>
  <text x="280" y="105" text-anchor="middle" class="t h" style="font-size:18.5px">Ghi lại quỹ đạo</text>
  <text x="280" y="134" text-anchor="middle" class="t s" style="font-size:10px">Hành động, kết quả và phản hồi</text>

  <rect x="385" y="72" width="150" height="90" rx="8" class="accent"/>
  <text x="460" y="105" text-anchor="middle" class="t h" style="font-size:14px">Hình thành tín hiệu</text>
  <text x="460" y="134" text-anchor="middle" class="t s" style="font-size:10px">Kết quả · Quá trình · Chất lượng</text>

  <rect x="565" y="55" width="230" height="124" rx="8" class="accent"/>
  <text x="680" y="84" text-anchor="middle" class="t h" style="font-size:14.5px">Sinh các bản cập nhật ứng viên</text>
  <rect x="582" y="102" width="92" height="27" rx="5" fill="#ffffff" stroke="#66808e"/>
  <rect x="686" y="102" width="92" height="27" rx="5" fill="#ffffff" stroke="#66808e"/>
  <rect x="582" y="139" width="92" height="27" rx="5" fill="#ffffff" stroke="#66808e"/>
  <rect x="686" y="139" width="92" height="27" rx="5" fill="#ffffff" stroke="#66808e"/>
  <text x="628" y="121" text-anchor="middle" class="t s">Tri thức</text>
  <text x="732" y="121" text-anchor="middle" class="t s">Chỉ dẫn</text>
  <text x="628" y="158" text-anchor="middle" class="t s" style="font-size:12.5px">Chương trình</text>
  <text x="732" y="158" text-anchor="middle" class="t s">Tham số</text>

  <rect x="825" y="72" width="150" height="90" rx="8" class="box"/>
  <text x="900" y="105" text-anchor="middle" class="t h" style="font-size:11px">Kiểm chứng và phát hành</text>
  <text x="900" text-anchor="middle" class="t s" y="125.3" style="font-size:15px">Hồi quy, phát hành</text><text x="900" text-anchor="middle" class="t s" y="142.7" style="font-size:15px">dần và quay lui</text>

  <path d="M175 117 H203" class="line"/>
  <path d="M355 117 H383" class="line"/>
  <path d="M535 117 H563" class="line"/>
  <path d="M795 117 H823" class="line"/>

  <path d="M900 162 V238 H100 V164" class="line" stroke-dasharray="7 5"/>
  <text x="500" y="265" text-anchor="middle" class="t h">Agent mới bước vào vòng tiếp theo</text>
  <text x="500" y="294" text-anchor="middle" class="t s">Chỉ những cập nhật làm thay đổi hành vi sau đó và vượt qua kiểm chứng mới tạo nên tiến hóa liên tục</text>
  <line x1="260" y1="318" x2="740" y2="318" stroke="#9aa8af" stroke-width="1"/>
</svg>
