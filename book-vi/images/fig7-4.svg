<text class="t m" x="113" y="100">Trạng thái cuối duy nhất, tra được</text>
<text class="t m" x="113" y="120">Đạt / không đạt</text>
<text class="t n" x="113" y="146">SWE-bench chạy kiểm thử</text>
<line x1="212" y1="108" x2="232" y2="108" stroke="#666666" stroke-width="1.5" marker-end="url(#ah-s)"/>

